<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Balitech - Reception Portal</title>
    <link rel="stylesheet" href="css/dropdown-fix.css?v=2.3">
    <link rel="stylesheet" href="css/portal-ui-polish.css?v=2.3">
    <link rel="stylesheet" href="css/reception-pro.css?v=2.3">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #f97316;
            --primary-dark: #ea580c;
            --primary-light: rgba(249, 115, 22, 0.15);
            --primary-glow: rgba(249, 115, 22, 0.4);
            --secondary: #10b981;
            --secondary-dark: #059669;
            --secondary-light: rgba(16, 185, 129, 0.15);
            --warning: #f59e0b;
            --danger: #ef4444;
            --info: #3b82f6;
            --purple: #8b5cf6;
            --pink: #ec4899;
            --cyan: #06b6d4;
            --bg-dark: #0a0c15;
            --bg-darker: #05070f;
            --bg-card: rgba(30, 36, 54, 0.95);
            --bg-sidebar: #0f1524;
            --bg-hover: rgba(249, 115, 22, 0.1);
            --text-primary: #ffffff;
            --text-secondary: #e2e8f0;
            --text-muted: #94a3b8;
            --text-dim: #64748b;
            --border-light: rgba(255, 255, 255, 0.08);
            --border-primary: rgba(249, 115, 22, 0.25);
            --shadow-sm: 0 4px 6px -1px rgba(0, 0, 0, 0.3);
            --shadow-md: 0 10px 15px -3px rgba(0, 0, 0, 0.3);
            --shadow-lg: 0 20px 25px -5px rgba(0, 0, 0, 0.3);
            --shadow-xl: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            --shadow-glow: 0 0 25px var(--primary-glow);
            --gradient-primary: linear-gradient(135deg, var(--primary), var(--primary-dark));
            --gradient-success: linear-gradient(135deg, var(--secondary), var(--secondary-dark));
        }

        [data-theme="light"] {
            --primary: #f97316;
            --primary-dark: #ea580c;
            --primary-light: rgba(249, 115, 22, 0.1);
            --bg-dark: #f8fafc;
            --bg-darker: #f1f5f9;
            --bg-card: #ffffff;
            --bg-sidebar: #1e293b;
            --text-primary: #0f172a;
            --text-secondary: #334155;
            --text-muted: #64748b;
            --border-light: rgba(0, 0, 0, 0.08);
        }

        body {
            font-family: 'Inter', sans-serif;
            background: radial-gradient(ellipse at 30% 40%, #0f0c29, #1a1a3e, #0a0a1a);
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
        }

        .bg-orb {
            position: fixed;
            border-radius: 50%;
            filter: blur(100px);
            opacity: 0.3;
            z-index: -1;
            animation: floatOrb 20s ease-in-out infinite;
        }

        .orb-1 {
            width: 500px;
            height: 500px;
            background: var(--primary);
            top: -200px;
            left: -200px;
            animation-delay: 0s;
        }

        .orb-2 {
            width: 400px;
            height: 400px;
            background: var(--primary-dark);
            bottom: -150px;
            right: -150px;
            animation-delay: 5s;
        }

        @keyframes floatOrb {
            0%, 100% { transform: translate(0, 0) scale(1); }
            33% { transform: translate(50px, -50px) scale(1.1); }
            66% { transform: translate(-30px, 40px) scale(0.9); }
        }

        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }

        ::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 10px;
        }

        ::-webkit-scrollbar-thumb {
            background: var(--primary);
            border-radius: 10px;
        }

        .app-container {
            display: flex;
            min-height: 100vh;
        }

        .sidebar {
            width: 280px;
            background: var(--bg-sidebar);
            backdrop-filter: blur(20px);
            border-right: 1px solid var(--border-primary);
            position: fixed;
            left: 0;
            top: 0;
            bottom: 0;
            z-index: 100;
            overflow-y: auto;
            transition: all 0.3s;
        }

        .sidebar-header {
            padding: 28px 24px;
            border-bottom: 1px solid var(--border-light);
            text-align: center;
        }

        .sidebar-logo {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
        }

        .sidebar-logo-icon {
            width: 48px;
            height: 48px;
            background: var(--gradient-primary);
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            color: white;
            box-shadow: var(--shadow-glow);
        }

        .sidebar-logo-text h2 {
            font-size: 22px;
            font-weight: 800;
            background: linear-gradient(135deg, #fff, var(--primary));
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .sidebar-logo-text p {
            font-size: 10px;
            color: var(--text-muted);
        }

        .sidebar-nav {
            padding: 24px 16px;
        }

        .nav-section-title {
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            color: var(--text-muted);
            margin-bottom: 12px;
            padding-left: 12px;
        }

        .nav-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 16px;
            border-radius: 12px;
            color: var(--text-muted);
            font-size: 13px;
            font-weight: 500;
            transition: all 0.3s;
            margin-bottom: 4px;
            cursor: pointer;
        }

        .nav-item:hover, .nav-item.active {
            background: var(--primary-light);
            color: var(--primary);
            transform: translateX(5px);
        }

        .nav-badge {
            margin-left: auto;
            background: var(--gradient-primary);
            padding: 2px 8px;
            border-radius: 20px;
            font-size: 10px;
            font-weight: 600;
            color: white;
        }

        .sidebar-footer {
            padding: 20px;
            border-top: 1px solid var(--border-light);
            margin-top: 20px;
        }

        .user-info {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 14px;
            background: rgba(255,255,255,0.04);
            border-radius: 20px;
        }

        .user-avatar {
            width: 45px;
            height: 45px;
            background: var(--gradient-primary);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            color: white;
        }

        .user-details h5 {
            font-size: 14px;
            font-weight: 600;
            color: var(--text-primary);
        }

        .user-details p {
            font-size: 11px;
            color: var(--text-muted);
        }

        .main-content {
            flex: 1;
            margin-left: 280px;
            padding: 20px 24px;
            max-width: calc(100vw - 280px);
            box-sizing: border-box;
            min-width: 0;
        }

        .top-header {
            background: var(--bg-card);
            backdrop-filter: blur(20px);
            border-radius: 20px;
            padding: 16px 24px;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 16px;
            border: 1px solid var(--border-light);
            box-shadow: var(--shadow-md);
        }

        .page-title h1 {
            font-size: 24px;
            font-weight: 800;
            background: linear-gradient(135deg, var(--text-primary), var(--primary));
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .page-title p {
            font-size: 13px;
            color: var(--text-muted);
        }

        .header-actions {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }

        .theme-toggle, .action-btn {
            padding: 10px 18px;
            border-radius: 40px;
            background: var(--bg-sidebar);
            border: 1px solid var(--border-light);
            color: var(--text-secondary);
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .theme-toggle:hover, .action-btn:hover {
            background: var(--primary);
            color: white;
            transform: translateY(-2px);
        }

        .action-btn.primary {
            background: var(--gradient-primary);
            color: white;
            border: none;
        }

        .voice-status {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 16px;
            background: var(--bg-sidebar);
            border-radius: 40px;
            border: 1px solid var(--border-light);
        }

        .status-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: var(--danger);
            position: relative;
        }

        .status-dot.active {
            background: var(--secondary);
            animation: pulse 2s infinite;
        }

        .gsheets-status {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 16px;
            background: var(--bg-sidebar);
            border-radius: 40px;
            border: 1px solid var(--border-light);
            color: var(--text-secondary);
            font-size: 12px;
        }

        .gsheets-status i {
            color: var(--primary);
        }

        /* Stat Cards - Premium Glowing Glassmorphism */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 18px;
            margin-bottom: 28px;
        }

        .stat-card {
            background: var(--bg-card);
            backdrop-filter: blur(16px);
            border-radius: 22px;
            padding: 22px 24px;
            border: 1px solid var(--border-light);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .stat-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: var(--primary);
            opacity: 0.8;
        }

        .stat-card:hover {
            transform: translateY(-4px);
            border-color: var(--border-primary);
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.35);
        }

        .stat-icon-wrap {
            width: 52px;
            height: 52px;
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            flex-shrink: 0;
        }

        .stat-info {
            flex: 1;
        }

        .stat-value {
            font-size: 28px;
            font-weight: 800;
            color: #ffffff;
            line-height: 1.1;
        }

        .stat-label {
            font-size: 12px;
            color: var(--text-muted);
            font-weight: 600;
            margin-top: 4px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        /* QR Section - Enhanced */
        .qr-section {
            background: var(--bg-card);
            border-radius: 28px;
            padding: 36px 40px;
            margin-bottom: 30px;
            border: 1px solid var(--border-primary);
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 40px;
            flex-wrap: wrap;
            position: relative;
            overflow: hidden;
            background: linear-gradient(135deg, rgba(30,36,54,0.95), rgba(15,21,36,0.95));
            box-shadow: var(--shadow-lg);
        }

        .qr-info {
            flex: 1;
            min-width: 280px;
        }

        .qr-info h3 {
            font-size: 24px;
            font-weight: 800;
            color: var(--text-primary);
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .qr-info h3 i {
            color: var(--primary);
            background: var(--primary-light);
            padding: 12px;
            border-radius: 16px;
            font-size: 20px;
        }

        .qr-info p {
            color: var(--text-muted);
            font-size: 14px;
            margin-bottom: 22px;
            line-height: 1.6;
        }

        .qr-code-box {
            background: #ffffff;
            padding: 16px;
            border-radius: 22px;
            text-align: center;
            border: 3px solid var(--primary);
            box-shadow: 0 0 35px var(--primary-glow);
            width: 200px;
            height: 200px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            transition: all 0.3s;
        }

        .qr-code-box:hover {
            transform: scale(1.03);
            box-shadow: 0 0 45px rgba(249, 115, 22, 0.6);
        }

        .qr-code-box img, .qr-code-box svg {
            width: 150px;
            height: 150px;
            display: block;
        }

        .qr-actions {
            display: flex;
            gap: 12px;
            margin-top: 10px;
            flex-wrap: wrap;
        }

        .qr-btn {
            padding: 12px 22px;
            border-radius: 14px;
            font-weight: 700;
            font-size: 13px;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: all 0.3s;
            background: var(--bg-sidebar);
            border: 1px solid var(--border-light);
            color: var(--text-secondary);
        }

        .qr-btn.primary {
            background: var(--gradient-primary);
            color: white;
            border: none;
            box-shadow: 0 4px 18px var(--primary-glow);
        }

        .qr-btn:hover {
            transform: translateY(-2px);
            border-color: var(--primary);
            color: white;
        }

        /* Quick View Gateway Cards */
        .gateway-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 24px;
            margin-bottom: 30px;
        }

        .gateway-card {
            background: var(--bg-card);
            border: 1px solid var(--border-light);
            border-radius: 24px;
            padding: 28px;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .gateway-card:hover {
            transform: translateY(-4px);
            border-color: var(--primary);
            box-shadow: var(--shadow-glow);
        }

        .gateway-content h4 {
            font-size: 20px;
            font-weight: 700;
            color: #ffffff;
            margin-bottom: 6px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .gateway-content p {
            font-size: 13px;
            color: var(--text-muted);
            line-height: 1.4;
        }

        .gateway-action {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .gateway-count {
            font-size: 32px;
            font-weight: 900;
            color: var(--primary);
        }

        .gateway-btn {
            width: 44px;
            height: 44px;
            border-radius: 14px;
            background: var(--primary-light);
            color: var(--primary);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            transition: all 0.2s;
        }

        .gateway-card:hover .gateway-btn {
            background: var(--primary);
            color: white;
            transform: translateX(4px);
        }

        /* Form Card - Enhanced */
        .form-card {
            background: var(--bg-card);
            border-radius: 28px;
            padding: 35px;
            border: 1px solid var(--border-light);
            position: relative;
            overflow: visible;
            transition: all 0.3s;
        }

        .form-card:hover {
            border-color: var(--border-primary);
            box-shadow: var(--shadow-glow);
        }

        .form-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: linear-gradient(90deg, transparent, var(--primary), transparent);
            animation: shimmer 3s infinite;
        }

        .card-header {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 1px solid var(--border-light);
        }

        .card-header i {
            font-size: 32px;
            color: var(--primary);
            background: var(--primary-light);
            padding: 14px;
            border-radius: 18px;
        }

        .card-header h3 {
            font-size: 24px;
            color: var(--text-primary);
            font-weight: 700;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 20px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 10px;
            font-weight: 600;
            font-size: 13px;
            color: var(--text-secondary);
        }

        .form-group label i {
            color: var(--primary);
            width: 18px;
        }

        .form-group label .required {
            color: var(--danger);
            margin-left: 4px;
        }

        .form-control, select.form-control {
            width: 100%;
            padding: 14px 18px;
            background: var(--bg-sidebar);
            border: 2px solid var(--border-light);
            border-radius: 16px;
            font-size: 14px;
            color: var(--text-primary);
            transition: all 0.3s;
        }

        .form-control:focus, select.form-control:focus {
            border-color: var(--primary);
            outline: none;
            box-shadow: 0 0 0 4px var(--primary-light);
        }

        .position-label-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 8px;
        }

        .btn-add-pos-quick {
            background: rgba(249, 115, 22, 0.12);
            color: var(--primary);
            border: 1px solid var(--border-primary);
            border-radius: 8px;
            padding: 4px 10px;
            font-size: 11px;
            font-weight: 600;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 5px;
            transition: all 0.2s ease;
        }

        .btn-add-pos-quick:hover {
            background: var(--primary);
            color: #ffffff;
            transform: translateY(-1px);
        }

        .custom-pos-box {
            display: none;
            margin-top: 8px;
            gap: 8px;
            align-items: center;
            animation: fadeInPos 0.25s ease;
        }

        .custom-pos-box.show {
            display: flex;
        }

        @keyframes fadeInPos {
            from { opacity: 0; transform: translateY(-6px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .btn-submit {
            width: 100%;
            padding: 16px;
            background: var(--gradient-success);
            color: white;
            border: none;
            border-radius: 16px;
            font-weight: 700;
            font-size: 16px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            transition: all 0.3s;
            margin-top: 20px;
        }

        .btn-submit:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-glow);
        }

        .candidate-list {
            max-height: 500px;
            overflow-y: auto;
        }

        .candidate-item {
            background: var(--bg-sidebar);
            border: 1px solid var(--border-light);
            border-radius: 12px;
            padding: 10px 14px;
            margin-bottom: 8px;
            transition: all 0.2s ease;
        }

        .candidate-item:hover {
            border-color: var(--primary);
            transform: translateX(3px);
        }

        .candidate-header {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 6px;
            flex-wrap: wrap;
        }

        .candidate-avatar {
            width: 34px;
            height: 34px;
            background: var(--gradient-primary);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 15px;
            color: white;
            flex-shrink: 0;
        }

        .candidate-info h4 {
            font-size: 14px;
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: 2px;
        }

        .candidate-details {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 4px 12px;
            margin: 6px 0;
            padding: 6px 10px;
            background: rgba(0,0,0,0.25);
            border-radius: 8px;
        }

        .detail-item {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 11px;
            color: var(--text-secondary);
        }

        .detail-item i {
            color: var(--primary);
            width: 14px;
            font-size: 11px;
        }

        .status-badge {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 20px;
            font-size: 10px;
            font-weight: 600;
        }

        .status-badge.scheduled { background: var(--info); color: white; }
        .status-badge.form { background: #8b5cf6; color: white; }
        .status-badge.checkin, .status-badge.appeared { background: var(--secondary); color: white; }
        .status-badge.checked-in { background: var(--secondary); color: white; }
        .status-badge.pending { background: var(--warning); color: white; }
        .status-badge.not_appeared { background: #ef4444; color: white; }
        .status-badge.left { background: #64748b; color: white; }

        .action-buttons {
            display: flex;
            gap: 6px;
            margin-top: 8px;
            flex-wrap: wrap;
        }

        .action-buttons .btn {
            flex: 1;
            min-width: 90px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 4px;
            padding: 6px 10px;
            font-size: 11px;
            font-weight: 600;
            cursor: pointer;
            border-radius: 8px;
            border: none;
            transition: all 0.2s ease;
        }

        .btn-appeared {
            background: linear-gradient(135deg, #10b981, #059669);
            color: white;
        }
        .btn-appeared:hover {
            box-shadow: 0 3px 10px rgba(16, 185, 129, 0.4);
            transform: translateY(-1px);
        }

        .btn-not-appeared {

    <script>
        // ==================== GOOGLE SHEETS CONFIGURATION ====================
        const GOOGLE_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbzCQLaK7VTxKcPGGpY3TeNBmfks-YjWQR-mJyZRYjLZAMZVs9y0CmvzI-JJKP-XaflRgg/exec';
        
        let recruiterLeads = [];
        let walkinCandidates = [];
        let qrGenerated = false;
        let allCandidates = [];

        const DEFAULT_POSITIONS = [
            'ACA Campaign',
            'Medicare Campaign',
            'MedAlert Campaign',
            'IT Department',
            'QA Department',
            'Developer Team',
            'HR Team',
            'Final Expense',
            'B2B Closer',
            'B2B Appointment Setters',
            'Social Media Team',
            'Medical Billing'
        ];

        const BRANCH_REFERRALS = {
            'main': [
                'Danish Khan',
                'Naina Fareed',
                'Bushra Malik',
                'Ahmed Shah'
            ],
            'commercial': [
                'Zoya',
                'Hamza Ali'
            ],
            'I9': [
                'Saad Khan',
                'Ayesha Malik'
            ],
            'workfromhome': [
                'WFH Recruiter'
            ]
        };

        function getStoredReferrals(branch = '') {
            try {
                const currentBranch = branch || (typeof localStorage !== 'undefined' && localStorage.getItem('companyBranch')) || 'all';
                let base = [];

                if (currentBranch && currentBranch !== 'all' && BRANCH_REFERRALS[currentBranch]) {
                    base = [...BRANCH_REFERRALS[currentBranch]];
                } else {
                    const allDefaults = new Set();
                    Object.values(BRANCH_REFERRALS).forEach(list => list.forEach(r => allDefaults.add(r)));
                    base = Array.from(allDefaults);
                }

                const saved = JSON.parse(localStorage.getItem('balitech_custom_referrals') || '[]');
                const combined = ['Walk-in', ...base];
                
                saved.forEach(item => {
                    const name = typeof item === 'object' ? item.name : item;
                    const itemBranch = typeof item === 'object' ? item.branch : 'all';
                    const clean = (name || '').trim();
                    
                    if (clean && !combined.some(x => x.toLowerCase() === clean.toLowerCase())) {
                        if (currentBranch === 'all' || itemBranch === 'all' || itemBranch === currentBranch) {
                            combined.push(clean);
                        }
                    }
                });
                return combined;
            } catch (e) {
                return ['Walk-in', 'Danish Khan', 'Naina Fareed', 'Bushra Malik', 'Ahmed Shah'];
            }
        }

        function saveCustomReferral(name, branch = 'all') {
            const clean = (name || '').trim();
            if (!clean) return;
            try {
                const saved = JSON.parse(localStorage.getItem('balitech_custom_referrals') || '[]');
                const exists = saved.some(item => {
                    const n = typeof item === 'object' ? item.name : item;
                    return n.toLowerCase() === clean.toLowerCase();
                });
                if (!exists) {
                    saved.push({ name: clean, branch: branch || 'all' });
                    localStorage.setItem('balitech_custom_referrals', JSON.stringify(saved));
                }
            } catch (e) {
                console.warn('Failed to save custom referral', e);
            }
        }

        function toggleCustomReferralInput() {
            const box = document.getElementById('customRefBox');
            const input = document.getElementById('customReferralInput');
            if (!box) return;
            if (box.classList.contains('show')) {
                box.classList.remove('show');
            } else {
                box.classList.add('show');
                if (input) input.focus();
            }
        }

        function handleAddCustomReferral() {
            const input = document.getElementById('customReferralInput');
            const branchSelect = document.getElementById('customReferralBranch');
            const val = input ? input.value.trim() : '';
            const branch = branchSelect ? branchSelect.value : 'all';
            
            if (!val) {
                showToast('Please enter referral / recruiter name', 'warning');
                return;
            }
            saveCustomReferral(val, branch);
            populateReferralsDropdown(val);
            if (input) input.value = '';
            const box = document.getElementById('customRefBox');
            if (box) box.classList.remove('show');
            showToast(`✅ Referral "${val}" added & selected!`, 'success');
        }

        function populateReferralsDropdown(selectedVal = '') {
            const sel = document.getElementById('walkinReferredBy');
            if (!sel) return;
            const currentSelected = selectedVal || sel.value || 'Walk-in';
            const referrals = getStoredReferrals();
            
            let html = '';
            referrals.forEach(r => {
                const isSel = (currentSelected && currentSelected.toLowerCase() === r.toLowerCase()) ? 'selected' : '';
                html += `<option value="${r.replace(/"/g, '&quot;')}" ${isSel}>${r}</option>`;
            });
            sel.innerHTML = html;
        }

        function getStoredPositions() {
            try {
                const saved = JSON.parse(localStorage.getItem('balitech_custom_positions') || '[]');
                const combined = [...DEFAULT_POSITIONS];
                saved.forEach(p => {
                    const clean = (p || '').trim();
                    if (clean && !combined.some(x => x.toLowerCase() === clean.toLowerCase())) {
                        combined.push(clean);
                    }
                });
                return combined;
            } catch (e) {
                return DEFAULT_POSITIONS;
            }
        }

        function saveCustomPosition(newPos) {
            const clean = (newPos || '').trim();
            if (!clean) return;
            try {
                const saved = JSON.parse(localStorage.getItem('balitech_custom_positions') || '[]');
                if (!saved.some(x => x.toLowerCase() === clean.toLowerCase()) &&
                    !DEFAULT_POSITIONS.some(x => x.toLowerCase() === clean.toLowerCase())) {
                    saved.push(clean);
                    localStorage.setItem('balitech_custom_positions', JSON.stringify(saved));
                }
            } catch (e) {
                console.warn('Failed to save custom position', e);
            }
        }

        function toggleCustomPositionInput() {
            const box = document.getElementById('customPosBox');
            const input = document.getElementById('customPositionInput');
            if (!box) return;
            if (box.classList.contains('show')) {
                box.classList.remove('show');
            } else {
                box.classList.add('show');
                if (input) {
                    input.focus();
                }
            }
        }

        function handleAddCustomPosition() {
            const input = document.getElementById('customPositionInput');
            const val = input ? input.value.trim() : '';
            if (!val) {
                showToast('Please enter a position name', 'warning');
                return;
            }
            saveCustomPosition(val);
            populatePositionsDropdown(val);
            if (input) input.value = '';
            const box = document.getElementById('customPosBox');

        function populatePositionsDropdown(selectedVal = '') {
            const sel = document.getElementById('walkinPosition');
            if (!sel) return;
            const currentSelected = selectedVal || sel.value;
            const positions = getStoredPositions();
            
            let html = '<option value="">Select Position</option>';

        async function loadDataFromSheet() {
            try {
                const gsheetsStatus = document.getElementById('gsheetsStatus');
                if (gsheetsStatus) {
                    gsheetsStatus.innerHTML = '<i class="fas fa-spinner fa-pulse"></i><span>Loading...</span>';
                }
                
                const response = await fetch(`${GOOGLE_SCRIPT_URL}?action=getAllCandidates`, {
                    method: 'GET',
                    mode: 'cors'
                });
                
                if (response.ok) {
                    const result = await response.json();
                    if (result.success && result.data) {
                        allCandidates = result.data;
                        console.log(`✅ Loaded ${allCandidates.length} candidates from Google Sheets`);
                        
                        if (gsheetsStatus) {
                            gsheetsStatus.innerHTML = '<i class="fas fa-check-circle"></i><span>Connected</span>';
                            setTimeout(() => {
                                if (gsheetsStatus) gsheetsStatus.innerHTML = '<i class="fas fa-cloud-upload-alt"></i><span>Ready</span>';
                            }, 2000);
                        }
                        return allCandidates;
                    }
                }
                throw new Error('Failed to fetch data');
            } catch (error) {
                console.error('Error loading from Google Sheets:', error);
                allCandidates = [];
                if (document.getElementById('gsheetsStatus')) {
                    document.getElementById('gsheetsStatus').innerHTML = '<i class="fas fa-exclamation-triangle"></i><span>Offline</span>';
                }
                return allCandidates;
            }
        }

        async function saveToGoogleSheets(candidateData) {
            try {
                const payload = {
                    action: 'addCandidate',
                    fullName: candidateData.fullName || '',
                    fatherName: candidateData.fatherName || '',
                    phone: candidateData.phone || '',
                    email: candidateData.email || '',
                    cnic: candidateData.cnic || '',
                    city: candidateData.city || '',
                    dob: candidateData.dob || '',
                    graduation: candidateData.graduation || '',
                    position: candidateData.position || '',
                    joiningDate: candidateData.joiningDate || new Date().toISOString().split('T')[0],
                    referredBy: candidateData.referredBy || 'Walk-in',
                    status: candidateData.status || 'pending',
                    interviewLevel: candidateData.interviewLevel || 'hr',
                    hrStatus: candidateData.hrStatus || 'pending',
                    gmStatus: candidateData.gmStatus || 'pending',
                    trainingStatus: candidateData.trainingStatus || 'pending',
                    callCount: candidateData.callCount || '0'
                };
                
                await fetch(GOOGLE_SCRIPT_URL, {

        async function loadData() {
            recruiterLeads = [];
            walkinCandidates = [];
            try {
                const data = window.PortalFetch
                    ? await PortalFetch.fetchJson('api/get_reception_scheduled.php', { ttlMs: 10000 })
                    : await (await fetch('api/get_reception_scheduled.php', { credentials: 'include' })).json();
                if (data.success && Array.isArray(data.data)) {
                    recruiterLeads = data.data.map(row => ({
                        id: row.leadId || row.id,
                        referenceId: row.referenceId || '',
                        externalLeadId: row.externalLeadId || '',
                        interviewId: row.interviewId || null,
                        name: row.fullName || row.name,
                        fullName: row.fullName || row.name,
                        fatherName: row.fatherName || '',
                        phone: row.phone || '',
                        email: row.email || '',
                        cnic: row.cnic || '',
                        city: row.city || '',
                        dob: row.dob || '',
                        graduation: row.graduation || '',
                        experience: row.experience || '',
                        position: row.position || 'Interview Candidate',
                        referredBy: row.referredBy || 'Walk-in',
                        interviewDateTime: row.interviewDateTime || '',
                        interviewDate: row.interviewDate || '',
                        interviewTime: row.interviewTime || '',
                        interviewLocation: row.interviewLocation || 'Main Office',
                        interviewer: row.interviewer || 'Walk-in Desk',
                        recruiterName: row.recruiterName || '',
                        source: row.source || 'recruiter',
                        queueType: row.queueType || 'scheduled',
                        badge: row.badge || 'Interview Scheduled',
                        currentStage: row.currentStage || '',
                        heardAbout: row.heardAbout || '',
                        duplicateFlags: row.duplicateFlags || '',
                        isDuplicate: !!row.isDuplicate || !!(row.duplicateFlags && row.duplicateFlags.length > 0),
                        applicantNotes: row.applicantNotes || '',
                        cvFileUrl: row.cvFileUrl || '',
                        hasCv: !!row.hasCv || !!row.cvFileUrl,
                        companyBranch: row.companyBranch || 'Islamabad',
                        isWalkin: !!row.isWalkin || (row.source || '').toLowerCase().includes('walk') || (row.source || '').toLowerCase() === 'mobile',
                        hasPreviousRejection: !!row.hasPreviousRejection,
                        previousRejectionSummary: row.previousRejectionSummary || '',
                        previousRejections: row.previousRejections || []
                    }));
                    walkinCandidates = recruiterLeads.filter(c =>
                        c.isWalkin ||
                        c.queueType === 'form' ||
                        (c.source || '').toLowerCase().includes('walk') ||
                        (c.source || '').toLowerCase() === 'mobile'
                    );
                } else if (!data.success) {
                    console.error('Reception queue API:', data.error);
                    showToast(data.error || 'Could not load scheduled list', 'error');
                }
            } catch (e) {
                console.error('Failed to load reception data from database', e);
                showToast('Failed to load scheduled interviews', 'error');
            }
            const scheduledBadge = document.getElementById('scheduledBadge');
            if (scheduledBadge) {
                scheduledBadge.textContent = recruiterLeads.filter(l => l.queueType === 'scheduled' || (!l.isWalkin && l.source !== 'walkin' && l.source !== 'mobile')).length;
            }
            const walkinBadge = document.getElementById('walkinBadge');
            if (walkinBadge) {
                walkinBadge.textContent = walkinCandidates.length;
            }
            return recruiterLeads;
        }

        function formatInterviewWhen(lead) {
            if (lead.interviewDateTime) {
                const raw = lead.interviewDateTime.trim();
                if (/^\d{4}-\d{2}-\d{2}/.test(raw)) {
                    const d = new Date(raw.replace(' ', 'T'));
                    if (!isNaN(d.getTime())) return d.toLocaleString();
                }
                return raw;
            }
            if (lead.isWalkin) return 'Walk-in Form Submitted';
            if (lead.queueType === 'form') return 'Form submitted - assign slot';
            return 'Date not set';
        }

        function renderScheduledList(targetElementId = 'scheduledLeadsList') {

            const scheduledCount = recruiterLeads.filter(l => l.queueType === 'scheduled' || (!l.isWalkin && l.source !== 'walkin' && l.source !== 'mobile')).length;
            const appearedCount = recruiterLeads.filter(l => l.currentStage === 'receptionist').length;
            const notAppearedCount = recruiterLeads.filter(l => l.currentStage === 'not_appeared').length;
            const leftCount = recruiterLeads.filter(l => l.currentStage === 'left').length;

            const statTotal = document.getElementById('statTotalCount');
            const statScheduled = document.getElementById('statScheduledCount');
            const statAppeared = document.getElementById('statAppearedCount');
            const statNotAppeared = document.getElementById('statNotAppearedCount');
            const statLeft = document.getElementById('statLeftCount');

            if (statTotal) statTotal.textContent = recruiterLeads.length;
            if (statScheduled) statScheduled.textContent = scheduledCount;
            if (statAppeared) statAppeared.textContent = appearedCount;
            if (statNotAppeared) statNotAppeared.textContent = notAppearedCount;
            if (statLeft) statLeft.textContent = leftCount;

            container.innerHTML = recruiterLeads.map(lead => generateCandidateCardHtml(lead, false)).join('');
        }

                method: 'POST',
                credentials: 'include',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });
            return res.json();
        }

        async function sendScheduledToHR(id, name, phone, position) {
            const lead = recruiterLeads.find(l => l.id === id);
            if (!lead) return;

            const candidateForHR = {
                id: id,
                leadId: id,
                fullName: name,
                fatherName: lead.fatherName || '',
                phone: phone,
                email: lead.email || '',
                cnic: lead.cnic || '',
                city: lead.city || '',
                dob: lead.dob || '',
                graduation: lead.graduation || '',
                position: position,
                referredBy: lead.referredBy || (lead.isWalkin ? 'Walk-in' : 'Recruiter'),
                source: lead.source || (lead.isWalkin ? 'walkin' : 'recruiter'),
                user_role: 'Reception'
            };

            const toHr = await updateLeadStage({
                ...candidateForHR,
                new_stage: 'interview_conducted',
                action: 'reception_send_hr',
                remark: `Interview conducted - sent to HR queue ${new Date().toLocaleString()}`
            });

            if (toHr.success) {
                showToast(`✅ ${name} sent to HR interview queue`, 'success');
                try {
                    if (lead.interviewId) {
                        await fetch('api/complete_interview.php', {
                            method: 'POST',
                            credentials: 'include',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ interview_id: lead.interviewId })
                        });
                    }
                } catch (e) {}
                await loadData();
                refreshActiveView();
            } else {
                showToast(toHr.error || 'Failed to send to HR', 'error');
            }
        }

                return;
            }

            container.innerHTML = items.map(lead => generateCandidateCardHtml(lead, true)).join('');
        }

        let walkinCnicTimer = null;
        let lastWalkinCheckedCnic = '';

        window.handleWalkinCnic = function(val, immediate = false) {
            const digits = (val || '').replace(/[^0-9]/g, '');
            const alertBox = document.getElementById('walkinCnicAlertBox');
            const spinner = document.getElementById('walkinCnicSpinner');
            
            if (digits.length < 13) {
                if (digits.length === 0 && alertBox) {
                    alertBox.style.display = 'none';
                }
                return;
            }

            if (digits === lastWalkinCheckedCnic && !immediate) return;

            clearTimeout(walkinCnicTimer);
            const runCheck = async () => {
                lastWalkinCheckedCnic = digits;
                if (spinner) spinner.style.display = 'inline';
                
                try {
                    const res = await fetch('api/verify_candidate_cnic.php?cnic=' + encodeURIComponent(digits), {
                        credentials: 'include'
                    });
                    const data = await res.json();
                    if (spinner) spinner.style.display = 'none';
                    
                    if (data.success && data.data) {
                        const d = data.data;
                        if (d.has_rejection) {
                            const rej = d.history.find(h => h.is_rejected) || d.history[0];
                            alertBox.style.display = 'block';
                            alertBox.style.background = 'rgba(239, 68, 68, 0.15)';
                            alertBox.style.border = '1px solid rgba(239, 68, 68, 0.5)';
                            alertBox.style.color = '#fca5a5';
                            alertBox.innerHTML = `
                                <div style="display:flex; justify-content:space-between; align-items:flex-start; gap:12px;">
                                    <div style="display:flex; gap:12px; align-items:flex-start;">
                                        <i class="fas fa-exclamation-triangle" style="font-size:22px; color:#ef4444; margin-top:2px;"></i>
                                        <div>
                                            <div style="font-weight:700; font-size:14px; color:#f87171;">⚠️ Candidate Previously Rejected at Another Branch!</div>
                                            <div style="margin-top:5px; font-size:12px; color:#e2e8f0;">
                                                <strong>Branch:</strong> <span style="color:#fb923c;">${rej ? rej.branch_label : 'Main Branch'}</span> &nbsp;|&nbsp;
                                                <strong>Date:</strong> ${rej ? rej.applied_date : 'Past'} &nbsp;|&nbsp;
                                                <strong>Status:</strong> <span style="background:rgba(239,68,68,0.3); padding:2px 8px; border-radius:4px; font-weight:600; color:#fff;">${rej ? rej.status_title : 'Rejected'}</span>
                                            </div>
                                            ${rej && rej.rejection_reason ? `<div style="margin-top:4px; font-size:12px; color:#fed7aa;"><strong>Rejection Reason:</strong> ${rej.rejection_reason}</div>` : ''}
                                            ${rej && rej.remarks && rej.remarks.length ? `<div style="margin-top:4px; font-size:11px; opacity:0.85;"><strong>Interviewer Remarks:</strong> "${rej.remarks[0].text}"</div>` : ''}
                                        </div>
                                    </div>
                                    <button type="button" class="btn btn-warning" style="padding:6px 12px; font-size:11px; border-radius:8px; white-space:nowrap;" onclick="showCrossBranchModal(0, '${digits}')">
                                        <i class="fas fa-history"></i> Full History
                                    </button>
                                </div>
                            `;
                        } else if (d.has_history) {
                            const first = d.history[0];
                            alertBox.style.display = 'block';
                            alertBox.style.background = 'rgba(245, 158, 11, 0.15)';
                            alertBox.style.border = '1px solid rgba(245, 158, 11, 0.4)';
                            alertBox.style.color = '#fde68a';
                            alertBox.innerHTML = `
                                <div style="display:flex; justify-content:space-between; align-items:center; gap:10px;">
                                    <div>
                                        <i class="fas fa-info-circle" style="color:#f59e0b; margin-right:6px;"></i>
                                        <strong>Candidate Applied Previously:</strong> ${first ? first.branch_label : 'Other Branch'} (${first ? first.applied_date : ''}) - Status: ${first ? first.status_title : ''}
                                    </div>

        // ==================== RECEPTION ANALYTICS & REPORTS MODULE ====================
        let currentReportData = [];
        let allReportRecords = [];
        let reportFilterState = {
            startDate: '',
            endDate: '',
            stage: 'all',
            search: '',
            preset: 'today'
        };

        function setReportDatePreset(preset) {
            reportFilterState.preset = preset;
            const today = new Date();
            const formatDate = (d) => {
                const year = d.getFullYear();
                const month = String(d.getMonth() + 1).padStart(2, '0');
                const day = String(d.getDate()).padStart(2, '0');
                return `${year}-${month}-${day}`;
            };

            let start = new Date();
            let end = new Date();

            if (preset === 'today') {
                start = today;
                end = today;
            } else if (preset === 'yesterday') {
                start.setDate(today.getDate() - 1);
                end.setDate(today.getDate() - 1);
            } else if (preset === 'this_week') {
                const dayOfWeek = today.getDay();
                const diffToMonday = (dayOfWeek + 6) % 7;
                start.setDate(today.getDate() - diffToMonday);
                end = today;
            } else if (preset === 'this_month') {
                start = new Date(today.getFullYear(), today.getMonth(), 1);
                end = today;
            } else if (preset === 'last_30_days') {
                start.setDate(today.getDate() - 29);
                end = today;
            } else if (preset === 'all_time') {
                start = new Date(2024, 0, 1);
                end = today;
            }

            reportFilterState.startDate = formatDate(start);
            reportFilterState.endDate = formatDate(end);

            const startEl = document.getElementById('reportStartDate');
            const endEl = document.getElementById('reportEndDate');
            if (startEl) startEl.value = reportFilterState.startDate;
            if (endEl) endEl.value = reportFilterState.endDate;

            // Highlight active preset button smoothly
            document.querySelectorAll('.preset-btn').forEach(btn => {
                if (btn.dataset.preset === preset) {
                    btn.classList.add('active');
                } else {
                    btn.classList.remove('active');
                }
            });

            loadReceptionReport();
        }

        async function loadReceptionReport() {
            const startInput = document.getElementById('reportStartDate');
            const endInput = document.getElementById('reportEndDate');
            const searchInput = document.getElementById('reportSearchInput');
            const tableBody = document.getElementById('reportTableBody');

            if (startInput) reportFilterState.startDate = startInput.value;
            if (endInput) reportFilterState.endDate = endInput.value;
            if (searchInput) reportFilterState.search = searchInput.value.trim();

            if (!tableBody) return;
            
            // If empty, show spinner; otherwise keep existing rows without jarring blink
            if (allReportRecords.length === 0) {
                tableBody.innerHTML = `<tr><td colspan="8" style="text-align:center; padding:30px; color:var(--text-muted);"><i class="fas fa-spinner fa-spin fa-2x"></i><p style="margin-top:8px;">Fetching reception reports...</p></td></tr>`;
            }

            try {
                const params = new URLSearchParams({
                    start_date: reportFilterState.startDate,
                    end_date: reportFilterState.endDate,
                    stage: 'all', // Fetch all to allow instant client-side tab switching
                    search: reportFilterState.search
                });

                const res = await fetch(`api/get_reception_reports.php?${params.toString()}`, {
                    credentials: 'include'
                });
                const result = await res.json();

                if (!result.success) {
                    tableBody.innerHTML = `<tr><td colspan="8" style="text-align:center; padding:30px; color:var(--danger);">${result.error || 'Failed to load report data'}</td></tr>`;
                    return;
                }

                const data = result.data;
                allReportRecords = data.records || [];

                // Update metric counters smoothly
                const counts = data.counts || {};
                const elTotal = document.getElementById('repMetricTotal');
                const elScheduled = document.getElementById('repMetricScheduled');
                const elAppeared = document.getElementById('repMetricAppeared');
                const elNotAppeared = document.getElementById('repMetricNotAppeared');
                const elLeft = document.getElementById('repMetricLeft');
                const elSentHr = document.getElementById('repMetricSentHr');

                if (elTotal) elTotal.textContent = counts.total || 0;
                if (elScheduled) elScheduled.textContent = counts.scheduled || 0;
                if (elAppeared) elAppeared.textContent = counts.appeared || 0;
                if (elNotAppeared) elNotAppeared.textContent = counts.not_appeared || 0;
                if (elLeft) elLeft.textContent = counts.left || 0;
                if (elSentHr) elSentHr.textContent = counts.sent_to_hr || 0;

                applyClientFilterAndRender();
            } catch (err) {
                console.error('Error fetching reception report:', err);
                tableBody.innerHTML = `<tr><td colspan="8" style="text-align:center; padding:30px; color:var(--danger);">Error loading report: ${err.message}</td></tr>`;
            }
        }

        function filterReportByStage(stage) {
            reportFilterState.stage = stage;
            document.querySelectorAll('.stage-filter-pill').forEach(pill => {
                if (pill.dataset.stage === stage) {
                    pill.classList.add('active');
                } else {
                    pill.classList.remove('active');
                }
            });
            applyClientFilterAndRender();
        }

        function applyClientFilterAndRender() {
            const searchVal = (reportFilterState.search || '').toLowerCase();
            const stage = reportFilterState.stage || 'all';

            let filtered = allReportRecords.filter(r => {
                // Stage Match
                let matchStage = false;
                if (stage === 'all') {
                    matchStage = true;
                } else if (stage === 'appeared' && r.category === 'appeared') {
                    matchStage = true;
                } else if (stage === 'not_appeared' && r.category === 'not_appeared') {
                    matchStage = true;
                } else if (stage === 'left' && r.category === 'left') {
                    matchStage = true;
                } else if (stage === 'scheduled' && r.category === 'scheduled') {
                    matchStage = true;
                } else if (stage === 'sent_to_hr' && r.category === 'sent_to_hr') {
                    matchStage = true;
                }

                if (!matchStage) return false;

                // Search Match
                if (searchVal) {
                    const searchStr = `${r.name} ${r.cnic} ${r.phone} ${r.position} ${r.city} ${r.branch} ${r.recruiterName}`.toLowerCase();
                    if (!searchStr.includes(searchVal)) return false;
                }

                return true;
            });

            currentReportData = filtered;

            const elRecordCount = document.getElementById('repRecordCount');
            if (elRecordCount) elRecordCount.textContent = `${filtered.length} records found`;

            renderReportTable(filtered);
        }

        function downloadReceptionCSV() {
            if (!currentReportData || currentReportData.length === 0) {
                showToast('No records to download', 'warning');
                return;
            }

            const headers = [
                'Candidate ID',
                'Full Name',
                'CNIC',
                'Phone',
                'Position',
                'City / Branch',
                'Source / Recruiter',
                'Interview Date',
                'Interview Time',
                'Reception Status',
                'System Stage',
                'Created At',
                'Updated At'
            ];

            const rows = currentReportData.map(r => [
                r.id,
                `"${(r.name || '').replace(/"/g, '""')}"`,
                `"${(r.cnic || '').replace(/"/g, '""')}"`,
                `"${(r.phone || '').replace(/"/g, '""')}"`,
                `"${(r.position || '').replace(/"/g, '""')}"`,
                `"${(r.city || r.branch || '').replace(/"/g, '""')}"`,
                `"${(r.recruiterName || r.source || 'Walk-in').replace(/"/g, '""')}"`,
                `"${(r.interviewDate || '').replace(/"/g, '""')}"`,
                `"${(r.interviewTime || '').replace(/"/g, '""')}"`,
                `"${r.category.toUpperCase()}"`,
                `"${(r.rawStage || '').replace(/"/g, '""')}"`,
                `"${(r.createdAt || '').replace(/"/g, '""')}"`,
                `"${(r.updatedAt || '').replace(/"/g, '""')}"`
            ]);

            const csvContent = '\uFEFF' + [headers.join(','), ...rows.map(e => e.join(','))].join('\n');
            const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
            const url = URL.createObjectURL(blob);
            const link = document.createElement('a');

            const startStr = reportFilterState.startDate || 'all';
            const endStr = reportFilterState.endDate || 'all';
            const fileName = `reception_report_${startStr}_to_${endStr}.csv`;

            link.setAttribute('href', url);
            link.setAttribute('download', fileName);
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            URL.revokeObjectURL(url);

            showToast(`📥 Report downloaded: ${fileName}`, 'success');
        }

                                    <th style="padding:14px 16px; font-size:11px; font-weight:700; color:var(--text-muted); text-transform:uppercase; letter-spacing:0.5px; min-width:180px;">Candidate Details</th>
                                    <th style="padding:14px 16px; font-size:11px; font-weight:700; color:var(--text-muted); text-transform:uppercase; letter-spacing:0.5px; white-space:nowrap;">CNIC</th>
                                    <th style="padding:14px 16px; font-size:11px; font-weight:700; color:var(--text-muted); text-transform:uppercase; letter-spacing:0.5px; white-space:nowrap;">Phone</th>
                                    <th style="padding:14px 16px; font-size:11px; font-weight:700; color:var(--text-muted); text-transform:uppercase; letter-spacing:0.5px;">Position</th>
                                    <th style="padding:14px 16px; font-size:11px; font-weight:700; color:var(--text-muted); text-transform:uppercase; letter-spacing:0.5px; white-space:nowrap;">Source / Recruiter</th>
                                    <th style="padding:14px 16px; font-size:11px; font-weight:700; color:var(--text-muted); text-transform:uppercase; letter-spacing:0.5px; white-space:nowrap;">Interview Schedule</th>
                                    <th style="padding:14px 16px; font-size:11px; font-weight:700; color:var(--text-muted); text-transform:uppercase; letter-spacing:0.5px; text-align:center; white-space:nowrap;">Stage / Status</th>
                                    <th style="padding:14px 16px; font-size:11px; font-weight:700; color:var(--text-muted); text-transform:uppercase; letter-spacing:0.5px; text-align:center; white-space:nowrap;">Audit History</th>
                                </tr>
                            </thead>
                            <tbody id="reportTableBody">
                                <!-- Rendered dynamically -->
                            </tbody>
                        </table>
                    </div>
                </div>
            `;

            // Setup preset dates and trigger first load
            setReportDatePreset(initialPreset);
        }

        window.showCrossBranchModal = async function(leadId, cnic) {
            const oldModal = document.querySelector('.modal-overlay');
            if (oldModal) oldModal.remove();

            const modal = document.createElement('div');
            modal.className = 'modal-overlay';
            modal.style.position = 'fixed';
            modal.style.top = '0';
            modal.style.left = '0';
            modal.style.right = '0';
            modal.style.bottom = '0';
            modal.style.background = 'rgba(0,0,0,0.8)';
            modal.style.backdropFilter = 'blur(10px)';
            modal.style.display = 'flex';
            modal.style.alignItems = 'center';
            modal.style.justifyContent = 'center';
            modal.style.zIndex = '9999';
            modal.style.padding = '20px';

            modal.innerHTML = `
                <div class="modal-card" style="background:var(--bg-card); border:1px solid var(--border-primary); border-radius:24px; padding:30px; max-width:750px; width:100%; max-height:85vh; overflow-y:auto; color:var(--text-primary); box-shadow:var(--shadow-2xl);">
                    <div style="display:flex; justify-content:space-between; align-items:center; border-bottom:1px solid var(--border-light); padding-bottom:16px; margin-bottom:20px;">
                        <h3 style="display:flex; align-items:center; gap:10px; font-size:20px;">
                            <i class="fas fa-history" style="color:var(--primary);"></i> Cross-Branch Candidate History
                        </h3>
                        <button onclick="this.closest('.modal-overlay').remove()" style="background:transparent; border:none; color:var(--text-muted); font-size:20px; cursor:pointer;"><i class="fas fa-times"></i></button>
                    </div>
                    <div id="crossBranchModalBody">
                        <div style="text-align:center; padding:30px; color:var(--text-muted);">
                            <i class="fas fa-spinner fa-spin fa-2x"></i>
                            <p style="margin-top:10px;">Fetching past records across all branches...</p>
                        </div>
                    </div>
                </div>
            `;
            document.body.appendChild(modal);

            try {
                const url = leadId ? `api/verify_candidate_cnic.php?lead_id=${leadId}` : `api/verify_candidate_cnic.php?cnic=${encodeURIComponent(cnic)}`;
                const res = await fetch(url, { credentials: 'include' });
                const data = await res.json();
                const container = document.getElementById('crossBranchModalBody');
                if (!container) return;

                if (!data.success || !data.data || data.data.history.length === 0) {
                    container.innerHTML = `
                        <div style="text-align:center; padding:30px; color:var(--text-muted);">
                            <i class="fas fa-check-circle" style="font-size:36px; color:var(--secondary); margin-bottom:10px;"></i>
                            <h4>No Prior Applications Found</h4>
                            <p style="font-size:13px; margin-top:5px;">This candidate has no recorded previous attempts or rejections in other branches.</p>
                        </div>
                    `;
                    return;
                }

                const d = data.data;
                container.innerHTML = `
                    <div style="margin-bottom:20px; padding:14px; border-radius:12px; ${d.has_rejection ? 'background:rgba(239,68,68,0.15); border:1px solid rgba(239,68,68,0.3); color:#fca5a5;' : 'background:rgba(59,130,246,0.1); border:1px solid rgba(59,130,246,0.3); color:#93c5fd;'}">
                        <strong>${d.summary}</strong>
                    </div>
                    <div style="display:flex; flex-direction:column; gap:16px;">
                        ${d.history.map(item => `
                            <div style="background:var(--bg-sidebar); border-radius:16px; padding:18px; border:1px solid ${item.is_rejected ? 'rgba(239,68,68,0.4)' : 'var(--border-light)'};">
                                <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:10px; margin-bottom:12px;">
                                    <div>
                                        <span style="font-size:16px; font-weight:700; color:#fff;">${item.full_name}</span>
                                        <span style="margin-left:10px; font-size:12px; padding:2px 8px; border-radius:6px; background:rgba(249,115,22,0.15); color:var(--primary); font-weight:600;">
                                            <i class="fas fa-building"></i> ${item.branch_label}
                                        </span>
                                    </div>
                                    <div style="padding:4px 10px; border-radius:20px; font-size:12px; font-weight:700; ${item.is_rejected ? 'background:#ef4444; color:#fff;' : 'background:var(--secondary); color:#fff;'}">
                                        ${item.status_title}
                                    </div>
                                </div>
                                <div style="display:grid; grid-template-columns:repeat(auto-fit, minmax(180px, 1fr)); gap:8px; font-size:12px; color:var(--text-muted); margin-bottom:12px;">
                                    <div><i class="fas fa-id-card"></i> CNIC: <strong style="color:var(--text-secondary);">${item.cnic || 'N/A'}</strong></div>
                                    <div><i class="fas fa-phone"></i> Phone: <strong style="color:var(--text-secondary);">${item.phone || 'N/A'}</strong></div>
                                    <div><i class="fas fa-briefcase"></i> Position: <strong style="color:var(--text-secondary);">${item.position || 'N/A'}</strong></div>
                                    <div><i class="fas fa-calendar"></i> Applied Date: <strong style="color:var(--text-secondary);">${item.applied_date}</strong></div>
                                </div>
                                ${item.rejection_reason ? `
                                    <div style="padding:10px 12px; background:rgba(239,68,68,0.1); border-radius:8px; font-size:12px; color:#fca5a5; margin-bottom:10px;">
                                        <strong><i class="fas fa-times-circle"></i> Rejection Reason:</strong> ${item.rejection_reason}
                                    </div>
                                ` : ''}
                                ${item.remarks && item.remarks.length > 0 ? `
                                    <div style="margin-top:10px;">
                                        <div style="font-size:11px; font-weight:700; text-transform:uppercase; color:var(--text-muted); margin-bottom:6px;">Interviewer Remarks:</div>
                                        ${item.remarks.map(r => `
                                            <div style="padding:8px 12px; background:rgba(255,255,255,0.03); border-left:3px solid var(--primary); border-radius:4px; font-size:12px; margin-bottom:4px;">
                                                <div style="color:var(--text-secondary);">${r.text}</div>
                                                <div style="font-size:10px; color:var(--text-muted); margin-top:2px;">— ${r.by} (${r.role || 'HR/Agent'}) on ${new Date(r.date).toLocaleString()}</div>
                                            </div>
                                        `).join('')}
                                    </div>
                                ` : ''}
                            </div>
                        `).join('')}
                    </div>
                `;
            } catch (e) {
                const container = document.getElementById('crossBranchModalBody');
                if (container) {
                    container.innerHTML = `<div style="color:var(--danger); padding:20px; text-align:center;">Failed to load candidate history: ${e.message}</div>`;
                }
            }
        };

        window.scrollMetricsSlider = function(amount) {
            const slider = document.getElementById('reportMetricsSlider');
            if (slider) {
                slider.scrollBy({ left: amount, behavior: 'smooth' });
            }
        };

        window.showDashboard = showDashboard;
        window.showReceptionReportsView = showReceptionReportsView;
        window.downloadReceptionCSV = downloadReceptionCSV;
        window.filterReportByStage = filterReportByStage;
        window.setReportDatePreset = setReportDatePreset;
        window.loadReceptionReport = loadReceptionReport;
        window.showScheduledInterviewsView = showScheduledInterviewsView;
        window.showWalkinLeadsView = showWalkinLeadsView;
        window.showScheduledLeads = showScheduledLeads;
        window.markCandidateAppearedGeneric = markCandidateAppearedGeneric;
        window.markCandidateNotAppearedGeneric = markCandidateNotAppearedGeneric;
        window.markCandidateLeftGeneric = markCandidateLeftGeneric;
        window.sendScheduledToHRGeneric = sendScheduledToHRGeneric;
        window.markScheduledAppeared = markScheduledAppeared;
        window.markScheduledNotAppeared = markScheduledNotAppeared;
        window.markScheduledLeft = markScheduledLeft;
        window.triggerCnicChecker = triggerCnicChecker;
        window.callCandidate = callCandidate;
        window.initializeVoice = initializeVoice;
        window.toggleTheme = toggleTheme;
        window.submitWalkin = submitWalkin;
        window.showQRCode = showQRCode;
        window.copyMobileLink = copyMobileLink;
        window.downloadQRCode = downloadQRCode;
        window.forceSync = forceSync;
        window.verifySync = verifySync;
        window.showSyncStats = showSyncStats;
        window.logout = logout;
        window.sendScheduledToHR = sendScheduledToHR;
        window.testVoice = testVoice;
        window.toggleCustomPositionInput = toggleCustomPositionInput;
        window.handleAddCustomPosition = handleAddCustomPosition;
        window.populatePositionsDropdown = populatePositionsDropdown;
        window.toggleCustomReferralInput = toggleCustomReferralInput;
        window.handleAddCustomReferral = handleAddCustomReferral;
        window.populateReferralsDropdown = populateReferralsDropdown;
        window.handleWalkinCnic = handleWalkinCnic;
        window.showCrossBranchModal = showCrossBranchModal;
    </script>
    <script src="js/portal-chat-fab.js"></script>
</body>
</html>
