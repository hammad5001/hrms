<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Balitech - Reception Portal</title>
    <link rel="stylesheet" href="css/dropdown-fix.css">
    <link rel="stylesheet" href="css/portal-ui-polish.css?v=1">
    <link rel="stylesheet" href="css/reception-pro.css?v=1">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #f97316;
            --primary-dark: #ea580c;
            --primary-light: rgba(249, 115, 22, 0.15);
            --primary-glow: rgba(249, 115, 22, 0.4);
            --secondary: #10b981;
            --secondary-dark: #059669;
            --secondary-light: rgba(16, 185, 129, 0.15);
            --warning: #f59e0b;
            --danger: #ef4444;
            --info: #3b82f6;
            --purple: #8b5cf6;
            --pink: #ec4899;
            --cyan: #06b6d4;
            --bg-dark: #0a0c15;
            --bg-darker: #05070f;
            --bg-card: rgba(30, 36, 54, 0.95);
            --bg-sidebar: #0f1524;
            --bg-hover: rgba(249, 115, 22, 0.1);
            --text-primary: #ffffff;
            --text-secondary: #e2e8f0;
            --text-muted: #94a3b8;
            --text-dim: #64748b;
            --border-light: rgba(255, 255, 255, 0.08);
            --border-primary: rgba(249, 115, 22, 0.25);
            --shadow-sm: 0 4px 6px -1px rgba(0, 0, 0, 0.3);
            --shadow-md: 0 10px 15px -3px rgba(0, 0, 0, 0.3);
            --shadow-lg: 0 20px 25px -5px rgba(0, 0, 0, 0.3);
            --shadow-xl: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            --shadow-glow: 0 0 25px var(--primary-glow);
            --gradient-primary: linear-gradient(135deg, var(--primary), var(--primary-dark));
            --gradient-success: linear-gradient(135deg, var(--secondary), var(--secondary-dark));
        }

        [data-theme="light"] {
            --primary: #f97316;
            --primary-dark: #ea580c;
            --primary-light: rgba(249, 115, 22, 0.1);
            --bg-dark: #f8fafc;
            --bg-darker: #f1f5f9;
            --bg-card: #ffffff;
            --bg-sidebar: #1e293b;
            --text-primary: #0f172a;
            --text-secondary: #334155;
            --text-muted: #64748b;
            --border-light: rgba(0, 0, 0, 0.08);
        }

        body {
            font-family: 'Inter', sans-serif;
            background: radial-gradient(ellipse at 30% 40%, #0f0c29, #1a1a3e, #0a0a1a);
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
        }

        .bg-orb {
            position: fixed;
            border-radius: 50%;
            filter: blur(100px);
            opacity: 0.3;
            z-index: -1;
            animation: floatOrb 20s ease-in-out infinite;
        }

        .orb-1 {
            width: 500px;
            height: 500px;
            background: var(--primary);
            top: -200px;
            left: -200px;
            animation-delay: 0s;
        }

        .orb-2 {
            width: 400px;
            height: 400px;
            background: var(--primary-dark);
            bottom: -150px;
            right: -150px;
            animation-delay: 5s;
        }

        @keyframes floatOrb {
            0%, 100% { transform: translate(0, 0) scale(1); }
            33% { transform: translate(50px, -50px) scale(1.1); }
            66% { transform: translate(-30px, 40px) scale(0.9); }
        }

        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }

        ::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 10px;
        }

        ::-webkit-scrollbar-thumb {
            background: var(--primary);
            border-radius: 10px;
        }

        .app-container {
            display: flex;
            min-height: 100vh;
        }

        .sidebar {
            width: 280px;
            background: var(--bg-sidebar);
            backdrop-filter: blur(20px);
            border-right: 1px solid var(--border-primary);
            position: fixed;
            left: 0;
            top: 0;
            bottom: 0;
            z-index: 100;
            overflow-y: auto;
            transition: all 0.3s;
        }

        .sidebar-header {
            padding: 28px 24px;
            border-bottom: 1px solid var(--border-light);
            text-align: center;
        }

        .sidebar-logo {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
        }

        .sidebar-logo-icon {
            width: 48px;
            height: 48px;
            background: var(--gradient-primary);
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            color: white;
            box-shadow: var(--shadow-glow);
        }

        .sidebar-logo-text h2 {
            font-size: 22px;
            font-weight: 800;
            background: linear-gradient(135deg, #fff, var(--primary));
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .sidebar-logo-text p {
            font-size: 10px;
            color: var(--text-muted);
        }

        .sidebar-nav {
            padding: 24px 16px;
        }

        .nav-section-title {
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            color: var(--text-muted);
            margin-bottom: 12px;
            padding-left: 12px;
        }

        .nav-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 16px;
            border-radius: 12px;
            color: var(--text-muted);
            font-size: 13px;
            font-weight: 500;
            transition: all 0.3s;
            margin-bottom: 4px;
            cursor: pointer;
        }

        .nav-item:hover, .nav-item.active {
            background: var(--primary-light);
            color: var(--primary);
            transform: translateX(5px);
        }

        .nav-badge {
            margin-left: auto;
            background: var(--gradient-primary);
            padding: 2px 8px;
            border-radius: 20px;
            font-size: 10px;
            font-weight: 600;
            color: white;
        }

        .sidebar-footer {
            padding: 20px;
            border-top: 1px solid var(--border-light);
            margin-top: 20px;
        }

        .user-info {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 14px;
            background: rgba(255,255,255,0.04);
            border-radius: 20px;
        }

        .user-avatar {
            width: 45px;
            height: 45px;
            background: var(--gradient-primary);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            color: white;
        }

        .user-details h5 {
            font-size: 14px;
            font-weight: 600;
            color: var(--text-primary);
        }

        .user-details p {
            font-size: 11px;
            color: var(--text-muted);
        }

        .main-content {
            flex: 1;
            margin-left: 280px;
            padding: 28px 36px;
        }

        .top-header {
            background: var(--bg-card);
            backdrop-filter: blur(20px);
            border-radius: 28px;
            padding: 20px 32px;
            margin-bottom: 28px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 20px;
            border: 1px solid var(--border-light);
            box-shadow: var(--shadow-md);
        }

        .page-title h1 {
            font-size: 24px;
            font-weight: 800;
            background: linear-gradient(135deg, var(--text-primary), var(--primary));
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .page-title p {
            font-size: 13px;
            color: var(--text-muted);
        }

        .header-actions {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }

        .theme-toggle, .action-btn {
            padding: 10px 18px;
            border-radius: 40px;
            background: var(--bg-sidebar);
            border: 1px solid var(--border-light);
            color: var(--text-secondary);
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .theme-toggle:hover, .action-btn:hover {
            background: var(--primary);
            color: white;
            transform: translateY(-2px);
        }

        .action-btn.primary {
            background: var(--gradient-primary);
            color: white;
            border: none;
        }

        .voice-status {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 16px;
            background: var(--bg-sidebar);
            border-radius: 40px;
            border: 1px solid var(--border-light);
        }

        .status-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: var(--danger);
            position: relative;
        }

        .status-dot.active {
            background: var(--secondary);
            animation: pulse 2s infinite;
        }

        .gsheets-status {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 16px;
            background: var(--bg-sidebar);
            border-radius: 40px;
            border: 1px solid var(--border-light);
            color: var(--text-secondary);
            font-size: 12px;
        }

        .gsheets-status i {
            color: var(--primary);
        }

        /* QR Section - Enhanced */
        .qr-section {
            background: var(--bg-card);
            border-radius: 28px;
            padding: 40px;
            margin-bottom: 30px;
            border: 1px solid var(--border-primary);
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 50px;
            flex-wrap: wrap;
            position: relative;
            overflow: hidden;
            background: linear-gradient(135deg, var(--bg-card), rgba(249,115,22,0.05));
        }

        .qr-info {
            flex: 1;
        }

        .qr-info h3 {
            font-size: 28px;
            color: var(--text-primary);
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .qr-info h3 i {
            color: var(--primary);
            background: var(--primary-light);
            padding: 12px;
            border-radius: 16px;
        }

        .qr-info p {
            color: var(--text-muted);
            font-size: 14px;
            margin-bottom: 25px;
            line-height: 1.6;
        }

        .qr-code-box {
            background: var(--bg-sidebar);
            padding: 25px;
            border-radius: 24px;
            text-align: center;
            border: 2px solid var(--primary);
            box-shadow: var(--shadow-glow);
            min-width: 220px;
        }

        .qr-code-box.hidden {
            display: none;
        }

        #qrcode {
            display: flex;
            justify-content: center;
        }

        #qrcode img {
            border-radius: 12px;
            padding: 8px;
            background: white;
        }

        .qr-actions {
            display: flex;
            gap: 12px;
            margin-top: 20px;
            flex-wrap: wrap;
        }

        .qr-btn {
            padding: 10px 20px;
            border-radius: 40px;
            font-weight: 600;
            font-size: 12px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: all 0.3s;
            background: var(--bg-sidebar);
            border: 1px solid var(--border-light);
            color: var(--text-secondary);
        }

        .qr-btn.primary {
            background: var(--gradient-primary);
            color: white;
            border: none;
        }

        .qr-btn:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-glow);
        }

        /* Form Card - Enhanced */
        .form-card {
            background: var(--bg-card);
            border-radius: 28px;
            padding: 35px;
            border: 1px solid var(--border-light);
            position: relative;
            overflow: visible;
            transition: all 0.3s;
        }

        .form-card:hover {
            border-color: var(--border-primary);
            box-shadow: var(--shadow-glow);
        }

        .form-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: linear-gradient(90deg, transparent, var(--primary), transparent);
            animation: shimmer 3s infinite;
        }

        .card-header {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 1px solid var(--border-light);
        }

        .card-header i {
            font-size: 32px;
            color: var(--primary);
            background: var(--primary-light);
            padding: 14px;
            border-radius: 18px;
        }

        .card-header h3 {
            font-size: 24px;
            color: var(--text-primary);
            font-weight: 700;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 20px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 10px;
            font-weight: 600;
            font-size: 13px;
            color: var(--text-secondary);
        }

        .form-group label i {
            color: var(--primary);
            width: 18px;
        }

        .form-group label .required {
            color: var(--danger);
            margin-left: 4px;
        }

        .form-control, select.form-control {
            width: 100%;
            padding: 14px 18px;
            background: var(--bg-sidebar);
            border: 2px solid var(--border-light);
            border-radius: 16px;
            font-size: 14px;
            color: var(--text-primary);
            transition: all 0.3s;
        }

        .form-control:focus, select.form-control:focus {
            border-color: var(--primary);
            outline: none;
            box-shadow: 0 0 0 4px var(--primary-light);
        }

        .position-label-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 8px;
        }

        .btn-add-pos-quick {
            background: rgba(249, 115, 22, 0.12);
            color: var(--primary);
            border: 1px solid var(--border-primary);
            border-radius: 8px;
            padding: 4px 10px;
            font-size: 11px;
            font-weight: 600;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 5px;
            transition: all 0.2s ease;
        }

        .btn-add-pos-quick:hover {
            background: var(--primary);
            color: #ffffff;
            transform: translateY(-1px);
        }

        .custom-pos-box {
            display: none;
            margin-top: 8px;
            gap: 8px;
            align-items: center;
            animation: fadeInPos 0.25s ease;
        }

        .custom-pos-box.show {
            display: flex;
        }

        @keyframes fadeInPos {
            from { opacity: 0; transform: translateY(-6px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .btn-submit {
            width: 100%;
            padding: 16px;
            background: var(--gradient-success);
            color: white;
            border: none;
            border-radius: 16px;
            font-weight: 700;
            font-size: 16px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            transition: all 0.3s;
            margin-top: 20px;
        }

        .btn-submit:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-glow);
        }

        .candidate-list {
            max-height: 500px;
            overflow-y: auto;
        }

        .candidate-item {
            background: var(--bg-sidebar);
            border: 1px solid var(--border-light);
            border-radius: 20px;
            padding: 20px;
            margin-bottom: 15px;
            transition: all 0.3s;
        }

        .candidate-item:hover {
            border-color: var(--primary);
            transform: translateX(5px);
        }

        .candidate-header {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 15px;
            flex-wrap: wrap;
        }

        .candidate-avatar {
            width: 55px;
            height: 55px;
            background: var(--gradient-primary);
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            color: white;
        }

        .candidate-info h4 {
            font-size: 16px;
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: 5px;
        }

        .candidate-details {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            margin: 15px 0;
            padding: 15px;
            background: rgba(0,0,0,0.2);
            border-radius: 16px;
        }

        .detail-item {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 12px;
            color: var(--text-secondary);
        }

        .detail-item i {
            color: var(--primary);
            width: 16px;
        }

        .status-badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 30px;
            font-size: 11px;
            font-weight: 600;
        }

        .status-badge.scheduled { background: var(--info); color: white; }
        .status-badge.form { background: #8b5cf6; color: white; }
        .status-badge.checkin { background: var(--secondary); color: white; }
        .status-badge.checked-in { background: var(--secondary); color: white; }
        .status-badge.pending { background: var(--warning); color: white; }

        .action-buttons {
            display: flex;
            gap: 8px;
            margin-top: 15px;
            flex-wrap: wrap;
        }

        .action-buttons .btn {
            flex: 1;
            justify-content: center;
            padding: 10px;
            font-size: 12px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-call {
            background: var(--info);
            color: white;
            border: none;
            border-radius: 12px;
        }

        .btn-send-hr {
            background: var(--gradient-primary);
            color: white;
            border: none;
            border-radius: 12px;
        }

        .btn-send-hr:hover, .btn-call:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-glow);
        }

        .voice-panel {
            position: fixed;
            bottom: 30px;
            right: 30px;
            background: var(--bg-card);
            border-radius: 60px;
            padding: 16px 24px;
            display: flex;
            align-items: center;
            gap: 20px;
            border: 2px solid var(--primary);
            transform: translateY(150px);
            transition: transform 0.4s;
            z-index: 1000;
        }

        .voice-panel.active {
            transform: translateY(0);
        }

        .voice-wave {
            display: flex;
            gap: 4px;
            align-items: center;
        }

        .voice-wave span {
            width: 5px;
            height: 20px;
            background: var(--primary);
            border-radius: 5px;
            animation: wave 1s infinite;
        }

        .voice-wave span:nth-child(2) { animation-delay: 0.2s; height: 30px; }
        .voice-wave span:nth-child(3) { animation-delay: 0.4s; height: 40px; }

        @keyframes wave {
            0%, 100% { transform: scaleY(0.8); }
            50% { transform: scaleY(1.5); }
        }

        .toast-container {
            position: fixed;
            top: 30px;
            right: 30px;
            z-index: 2000;
        }

        .toast {
            background: var(--bg-card);
            border-left: 4px solid var(--secondary);
            border-radius: 14px;
            padding: 14px 20px;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 12px;
            transform: translateX(400px);
            transition: transform 0.3s;
            color: var(--text-primary);
        }

        .toast.show {
            transform: translateX(0);
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: var(--text-muted);
        }

        .empty-state i {
            font-size: 60px;
            margin-bottom: 15px;
            opacity: 0.5;
        }

        @keyframes shimmer {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(100%); }
        }

        @keyframes pulse {
            0%, 100% { box-shadow: 0 0 0 0 var(--primary-glow); }
            50% { box-shadow: 0 0 20px 5px var(--primary-glow); }
        }

        @media (max-width: 768px) {
            .sidebar {
                transform: translateX(-100%);
                position: fixed;
                z-index: 200;
            }
            .main-content {
                margin-left: 0;
                padding: 20px;
            }
            .form-row {
                grid-template-columns: 1fr;
            }
            .qr-section {
                flex-direction: column;
                text-align: center;
            }
        }
    </style>
</head>
<body data-theme="dark">
    <div class="bg-orb orb-1"></div>
    <div class="bg-orb orb-2"></div>

    <div class="app-container">
        <aside class="sidebar">
            <div class="sidebar-header">
                <div class="sidebar-logo">
                    <div class="sidebar-logo-icon"><i class="fas fa-clipboard-list"></i></div>
                    <div class="sidebar-logo-text">
                        <h2>BALITECH</h2>
                        <p>RECEPTION PORTAL</p>
                    </div>
                </div>
            </div>
            <div class="sidebar-nav">
                <div class="nav-section-title">MAIN</div>
                <div class="nav-item active" onclick="showDashboard()"><i class="fas fa-home"></i> Dashboard</div>
                <div class="nav-section-title">RECRUITER LEADS</div>
                <div class="nav-item" onclick="showScheduledLeads()">
                    <i class="fas fa-calendar-alt"></i> Scheduled Interviews
                    <span class="nav-badge" id="scheduledBadge">0</span>
                </div>
                <div class="nav-section-title">RECORDS & ARCHIVE</div>
                <div class="nav-item" onclick="window.location.href='candidate-records.html'"><i class="fas fa-database"></i> Candidate Records</div>
                <div class="nav-section-title">MESSAGES</div>
                <div class="nav-item" onclick="window.location.href='chat-portal.html'"><i class="fas fa-comments"></i> Chat</div>
            </div>
            <div class="sidebar-footer">
                <div class="user-info">
                    <div class="user-avatar"><i class="fas fa-user-tie"></i></div>
                    <div class="user-details">
                        <h5>Reception Desk</h5>
                        <p>reception@balitech.com</p>
                    </div>
                </div>
            </div>
        </aside>

        <main class="main-content" id="mainContent"></main>
    </div>

            <div class="voice-name" id="voiceName">Calling...</div>

    <script>
        // ==================== GOOGLE SHEETS CONFIGURATION ====================
        const GOOGLE_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbzCQLaK7VTxKcPGGpY3TeNBmfks-YjWQR-mJyZRYjLZAMZVs9y0CmvzI-JJKP-XaflRgg/exec';
        
        let recruiterLeads = [];
        let walkinCandidates = [];
        let qrGenerated = false;
        let allCandidates = [];

        const DEFAULT_POSITIONS = [
            'ACA Campaign',
            'Medicare Campaign',
            'MedAlert Campaign',
            'IT Department',
            'QA Department',
            'Developer Team',
            'HR Team',
            'Final Expense',
            'B2B Closer',
            'B2B Appointment Setters',
            'Social Media Team',
            'Medical Billing'
        ];

        const BRANCH_REFERRALS = {
            'main': [
                'Danish Khan',
                'Naina Fareed',
                'Bushra Malik',
                'Ahmed Shah'
            ],
            'commercial': [
                'Zoya',
                'Hamza Ali'
            ],
            'I9': [
                'Saad Khan',
                'Ayesha Malik'
            ],
            'workfromhome': [
                'WFH Recruiter'
            ]
        };

        function getStoredReferrals(branch = '') {
            try {
                const currentBranch = branch || (typeof localStorage !== 'undefined' && localStorage.getItem('companyBranch')) || 'all';
                let base = [];

                if (currentBranch && currentBranch !== 'all' && BRANCH_REFERRALS[currentBranch]) {
                    base = [...BRANCH_REFERRALS[currentBranch]];
                } else {
                    const allDefaults = new Set();
                    Object.values(BRANCH_REFERRALS).forEach(list => list.forEach(r => allDefaults.add(r)));
                    base = Array.from(allDefaults);
                }

                const saved = JSON.parse(localStorage.getItem('balitech_custom_referrals') || '[]');
                const combined = ['Walk-in', ...base];
                
                saved.forEach(item => {
                    const name = typeof item === 'object' ? item.name : item;
                    const itemBranch = typeof item === 'object' ? item.branch : 'all';
                    const clean = (name || '').trim();
                    
                    if (clean && !combined.some(x => x.toLowerCase() === clean.toLowerCase())) {
                        if (currentBranch === 'all' || itemBranch === 'all' || itemBranch === currentBranch) {
                            combined.push(clean);
                        }
                    }
                });
                return combined;
            } catch (e) {
                return ['Walk-in', 'Danish Khan', 'Naina Fareed', 'Bushra Malik', 'Ahmed Shah'];
            }
        }

        function saveCustomReferral(name, branch = 'all') {
            const clean = (name || '').trim();
            if (!clean) return;
            try {
                const saved = JSON.parse(localStorage.getItem('balitech_custom_referrals') || '[]');
                const exists = saved.some(item => {
                    const n = typeof item === 'object' ? item.name : item;
                    return n.toLowerCase() === clean.toLowerCase();
                });
                if (!exists) {
                    saved.push({ name: clean, branch: branch || 'all' });
                    localStorage.setItem('balitech_custom_referrals', JSON.stringify(saved));
                }
            } catch (e) {
                console.warn('Failed to save custom referral', e);
            }
        }

        function toggleCustomReferralInput() {
            const box = document.getElementById('customRefBox');
            const input = document.getElementById('customReferralInput');
            if (!box) return;
            if (box.classList.contains('show')) {
                box.classList.remove('show');
            } else {
                box.classList.add('show');
                if (input) input.focus();
            }
        }

        function handleAddCustomReferral() {
            const input = document.getElementById('customReferralInput');
            const branchSelect = document.getElementById('customReferralBranch');
            const val = input ? input.value.trim() : '';
            const branch = branchSelect ? branchSelect.value : 'all';
            
            if (!val) {
                showToast('Please enter referral / recruiter name', 'warning');
                return;
            }
            saveCustomReferral(val, branch);
            populateReferralsDropdown(val);
            if (input) input.value = '';
            const box = document.getElementById('customRefBox');
            if (box) box.classList.remove('show');
            showToast(`✅ Referral "${val}" added & selected!`, 'success');
        }

        function populateReferralsDropdown(selectedVal = '') {
            const sel = document.getElementById('walkinReferredBy');
            if (!sel) return;
            const currentSelected = selectedVal || sel.value || 'Walk-in';
            const referrals = getStoredReferrals();
            
            let html = '';
            referrals.forEach(r => {
                const isSel = (currentSelected && currentSelected.toLowerCase() === r.toLowerCase()) ? 'selected' : '';
                html += `<option value="${r.replace(/"/g, '&quot;')}" ${isSel}>${r}</option>`;
            });
            sel.innerHTML = html;
        }

        function getStoredPositions() {
            try {
                const saved = JSON.parse(localStorage.getItem('balitech_custom_positions') || '[]');
                const combined = [...DEFAULT_POSITIONS];
                saved.forEach(p => {
                    const clean = (p || '').trim();
                    if (clean && !combined.some(x => x.toLowerCase() === clean.toLowerCase())) {
                        combined.push(clean);
                    }
                });
                return combined;
            } catch (e) {
                return DEFAULT_POSITIONS;
            }
        }

        function saveCustomPosition(newPos) {
            const clean = (newPos || '').trim();
            if (!clean) return;
            try {
                const saved = JSON.parse(localStorage.getItem('balitech_custom_positions') || '[]');
                if (!saved.some(x => x.toLowerCase() === clean.toLowerCase()) &&
                    !DEFAULT_POSITIONS.some(x => x.toLowerCase() === clean.toLowerCase())) {
                    saved.push(clean);
                    localStorage.setItem('balitech_custom_positions', JSON.stringify(saved));
                }
            } catch (e) {
                console.warn('Failed to save custom position', e);
            }
        }

        function toggleCustomPositionInput() {
            const box = document.getElementById('customPosBox');
            const input = document.getElementById('customPositionInput');
            if (!box) return;
            if (box.classList.contains('show')) {
                box.classList.remove('show');
            } else {
                box.classList.add('show');
                if (input) {
                    input.focus();
                }
            }
        }

        function handleAddCustomPosition() {
            const input = document.getElementById('customPositionInput');
            const val = input ? input.value.trim() : '';
            if (!val) {
                showToast('Please enter a position name', 'warning');
                return;
            }
            saveCustomPosition(val);
            populatePositionsDropdown(val);
            if (input) input.value = '';
            const box = document.getElementById('customPosBox');
            if (box) box.classList.remove('show');
            showToast(`✅ Position "${val}" added & selected!`, 'success');
        }

        function populatePositionsDropdown(selectedVal = '') {
            const sel = document.getElementById('walkinPosition');
            if (!sel) return;
            const currentSelected = selectedVal || sel.value;
            const positions = getStoredPositions();
            
            let html = '<option value="">Select Position</option>';
            positions.forEach(p => {
                const isSel = (currentSelected && currentSelected.toLowerCase() === p.toLowerCase()) ? 'selected' : '';
                html += `<option value="${p.replace(/"/g, '&quot;')}" ${isSel}>${p}</option>`;
            });
            sel.innerHTML = html;
        }

        // Voice: js/reception-voice.js (HR announcements polled; local Announce uses same engine)
        function initializeVoice() {
            if (window.ReceptionVoice) {
                ReceptionVoice.refreshVoices();
                ReceptionVoice.testVoice();
            }
        }

        async function loadDataFromSheet() {
            try {
                const gsheetsStatus = document.getElementById('gsheetsStatus');
                if (gsheetsStatus) {
                    gsheetsStatus.innerHTML = '<i class="fas fa-spinner fa-pulse"></i><span>Loading...</span>';
                }
                
                const response = await fetch(`${GOOGLE_SCRIPT_URL}?action=getAllCandidates`, {
                    method: 'GET',
                    mode: 'cors'
                });
                
                if (response.ok) {
                    const result = await response.json();
                    if (result.success && result.data) {
                        allCandidates = result.data;
                        console.log(`✅ Loaded ${allCandidates.length} candidates from Google Sheets`);
                        
                        if (gsheetsStatus) {
                            gsheetsStatus.innerHTML = '<i class="fas fa-check-circle"></i><span>Connected</span>';
                            setTimeout(() => {
                                if (gsheetsStatus) gsheetsStatus.innerHTML = '<i class="fas fa-cloud-upload-alt"></i><span>Ready</span>';
                            }, 2000);
                        }
                        return allCandidates;
                    }
                }
                throw new Error('Failed to fetch data');
            } catch (error) {
                console.error('Error loading from Google Sheets:', error);
                allCandidates = [];
                if (document.getElementById('gsheetsStatus')) {
                    document.getElementById('gsheetsStatus').innerHTML = '<i class="fas fa-exclamation-triangle"></i><span>Offline</span>';
                }
                return allCandidates;
            }
        }

        async function saveToGoogleSheets(candidateData) {
            try {
                const payload = {
                    action: 'addCandidate',
                    fullName: candidateData.fullName || '',
                    fatherName: candidateData.fatherName || '',
                    phone: candidateData.phone || '',
                    email: candidateData.email || '',
                    cnic: candidateData.cnic || '',
                    city: candidateData.city || '',
                    dob: candidateData.dob || '',
                    graduation: candidateData.graduation || '',
                    position: candidateData.position || '',
                    joiningDate: candidateData.joiningDate || new Date().toISOString().split('T')[0],
                    referredBy: candidateData.referredBy || 'Walk-in',
                    status: candidateData.status || 'pending',
                    interviewLevel: candidateData.interviewLevel || 'hr',
                    hrStatus: candidateData.hrStatus || 'pending',
                    gmStatus: candidateData.gmStatus || 'pending',
                    trainingStatus: candidateData.trainingStatus || 'pending',
                    callCount: candidateData.callCount || '0'
                };
                
                await fetch(GOOGLE_SCRIPT_URL, {
                    method: 'POST',
                    mode: 'no-cors',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                
                return true;
            } catch (error) {
                console.error('Error saving to Google Sheets:', error);
                return false;
            }
        }

        async function mirrorCandidateToSheet(candidateData, eventName = 'update') {
            try {
                await fetch('api/sheets_mirror.php?action=pushCandidate', {
                    method: 'POST',
                    credentials: 'include',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ event: eventName, candidate: candidateData })
                });
            } catch (error) {
                console.warn('Sheet mirror API failed', error);
            }
        }

        async function loadData() {
            recruiterLeads = [];
            walkinCandidates = [];
            try {
                const data = window.PortalFetch
                    ? await PortalFetch.fetchJson('api/get_reception_scheduled.php', { ttlMs: 10000 })
                    : await (await fetch('api/get_reception_scheduled.php', { credentials: 'include' })).json();
                if (data.success && Array.isArray(data.data)) {
                    recruiterLeads = data.data.map(row => ({
                        id: row.leadId || row.id,
                        interviewId: row.interviewId || null,
                        name: row.fullName || row.name,
                        fullName: row.fullName || row.name,
                        fatherName: row.fatherName || '',
                        phone: row.phone || '',
                        email: row.email || '',
                        cnic: row.cnic || '',
                        city: row.city || '',
                        dob: row.dob || '',
                        graduation: row.graduation || '',
                        position: row.position || 'Interview Candidate',
                        referredBy: row.referredBy || 'Walk-in',
                        interviewDateTime: row.interviewDateTime || '',
                        interviewDate: row.interviewDate || '',
                        interviewTime: row.interviewTime || '',
                        interviewLocation: row.interviewLocation || 'Main Office',
                        interviewer: row.interviewer || 'HR Manager',
                        recruiterName: row.recruiterName || '',
                        source: row.source || 'recruiter',
                        queueType: row.queueType || 'scheduled',
                        badge: row.badge || 'Interview Scheduled',
                        currentStage: row.currentStage || ''
                    }));
                    walkinCandidates = recruiterLeads.filter(c =>
                        c.queueType === 'form' ||
                        (c.source || '').includes('walk') ||
                        (c.source || '') === 'mobile'
                    );
                } else if (!data.success) {
                    console.error('Reception queue API:', data.error);
                    showToast(data.error || 'Could not load scheduled list', 'error');
                }
            } catch (e) {
                console.error('Failed to load reception data from database', e);
                showToast('Failed to load scheduled interviews', 'error');
            }
            const badge = document.getElementById('scheduledBadge');
            if (badge) {
                badge.textContent = recruiterLeads.length;
            }
            return recruiterLeads;
        }

        function formatInterviewWhen(lead) {
            if (lead.interviewDateTime) {
                const raw = lead.interviewDateTime.trim();
                if (/^\d{4}-\d{2}-\d{2}/.test(raw)) {
                    const d = new Date(raw.replace(' ', 'T'));
                    if (!isNaN(d.getTime())) return d.toLocaleString();
                }
                return raw;
            }
            if (lead.queueType === 'form') return 'Form submitted - assign slot';
            return 'Date not set';
        }

        function renderScheduledList() {
            const container = document.getElementById('scheduledLeadsList');
            if (!container) return;

            const scheduledCount = recruiterLeads.filter(l => l.queueType === 'scheduled').length;
            const formCount = recruiterLeads.filter(l => l.queueType === 'form').length;
            const statScheduled = document.getElementById('statScheduledCount');
            const statForms = document.getElementById('statFormCount');
            if (statScheduled) statScheduled.textContent = scheduledCount;
            if (statForms) statForms.textContent = formCount;

            if (recruiterLeads.length === 0) {
                container.innerHTML = '<div class="empty-state"><i class="fas fa-calendar-times"></i><p>No scheduled interviews or applications yet</p><p style="font-size: 12px; margin-top: 10px;">Recruiter schedules and mobile/QR form submissions appear here automatically</p></div>';
                return;
            }

            container.innerHTML = recruiterLeads.map(lead => {
                const safeName = (lead.fullName || lead.name || '').replace(/'/g, "\\'");
                const safePos = (lead.position || '').replace(/'/g, "\\'");
                const typeClass = lead.queueType === 'form' ? 'form' : (lead.queueType === 'checkin' ? 'checkin' : 'scheduled');
                const sourceLabel = lead.source === 'mobile' ? 'Mobile Form' : (lead.recruiterName ? `Recruiter: ${lead.recruiterName}` : (lead.referredBy || 'Walk-in'));
                return `
                    <div class="candidate-item" ${lead.hasPreviousRejection ? 'style="border-left: 3px solid var(--danger);"' : ''}>
                        <div class="candidate-header">
                            <div class="candidate-avatar" ${lead.hasPreviousRejection ? 'style="background: rgba(239, 68, 68, 0.15); color: var(--danger);"' : ''}><i class="fas ${lead.hasPreviousRejection ? 'fa-user-times' : 'fa-user'}"></i></div>
                            <div class="candidate-info">
                                <h4>${lead.fullName || lead.name}</h4>
                                <div style="display:flex; flex-wrap:wrap; gap:6px; align-items:center;">
                                    <div class="status-badge ${typeClass}">${lead.badge || 'Scheduled'}</div>
                                    ${lead.hasPreviousRejection ? `
                                        <div class="status-badge" style="background: rgba(239, 68, 68, 0.25); color: #f87171; border: 1px solid rgba(239,68,68,0.5); cursor:pointer;" onclick="showCrossBranchModal(${lead.id}, '${lead.cnic || ''}')" title="Click to view past interview rejection details">
                                            <i class="fas fa-exclamation-triangle"></i> ${lead.previousRejectionSummary || 'Prev. Rejected'}
                                        </div>` : ''}
                                </div>
                            </div>
                        </div>
                        <div class="candidate-details">
                            <div class="detail-item"><i class="fas fa-phone"></i> ${lead.phone || 'N/A'}</div>
                            <div class="detail-item"><i class="fas fa-id-card"></i> ${lead.cnic || 'N/A'}</div>
                            <div class="detail-item"><i class="fas fa-briefcase"></i> ${lead.position || 'N/A'}</div>
                            <div class="detail-item"><i class="fas fa-calendar"></i> ${formatInterviewWhen(lead)}</div>
                            <div class="detail-item"><i class="fas fa-building"></i> ${lead.interviewLocation || 'Main Office'}</div>
                            <div class="detail-item"><i class="fas fa-tag"></i> ${sourceLabel}</div>
                            ${lead.interviewer ? `<div class="detail-item"><i class="fas fa-user-tie"></i> Interviewer: ${lead.interviewer}</div>` : ''}
                        </div>
                        ${lead.hasPreviousRejection ? `
                        <div style="margin: 10px 0 14px 0; padding: 10px 14px; background: rgba(239,68,68,0.1); border: 1px dashed rgba(239,68,68,0.3); border-radius: 10px; font-size: 12px; color: #fca5a5;">
                            <i class="fas fa-history" style="color: #ef4444; margin-right: 6px;"></i> <strong>Cross-Branch Alert:</strong> Candidate previously attended interview at <strong>${lead.previousRejections && lead.previousRejections[0] ? lead.previousRejections[0].branch : 'another branch'}</strong> and was <strong>Rejected</strong>. Reason: <em>${lead.previousRejections && lead.previousRejections[0] ? lead.previousRejections[0].reason : 'N/A'}</em>
                        </div>` : ''}
                        <div class="action-buttons">
                            <button class="btn btn-call" onclick="callCandidate('${safeName}', 'Interview')"><i class="fas fa-volume-up"></i> Announce</button>
                            <button class="btn btn-secondary" onclick="checkInScheduled(${lead.id}, '${safeName}', '${lead.phone}')"><i class="fas fa-door-open"></i> Check In</button>
                            ${(lead.hasPreviousHistory || lead.hasPreviousRejection) ? `<button class="btn btn-warning" style="background: rgba(245, 158, 11, 0.15); color: #f59e0b; border: 1px solid rgba(245, 158, 11, 0.3);" onclick="showCrossBranchModal(${lead.id}, '${lead.cnic || ''}')"><i class="fas fa-history"></i> Past History</button>` : ''}
                            <button class="btn btn-warning" onclick="markScheduledNotAppeared(${lead.id}, '${safeName}', '${lead.phone}')"><i class="fas fa-user-slash"></i> Not Appeared</button>
                            <button class="btn btn-send-hr" onclick="sendScheduledToHR(${lead.id}, '${safeName}', '${lead.phone}', '${safePos}')"><i class="fas fa-paper-plane"></i> Send to HR</button>
                        </div>
                    </div>`;
            }).join('');
        }

        function saveData() {
            /* Walk-ins and leads persist via api/update_candidate_global.php */
        }

        function callCandidate(name, room) {
            if (window.announceCandidate) {
                announceCandidate(name, room || 'Interview');
            } else if (window.ReceptionVoice) {
                ReceptionVoice.announceCandidate(name, room || 'Interview');
            }
        }

        async function updateLeadStage(payload) {
            if (window.PortalFetch) PortalFetch.invalidatePipelineCaches();
            const res = await fetch('api/update_candidate_global.php', {
                method: 'POST',
                credentials: 'include',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });
            return res.json();
        }

        async function sendToHR(candidateData, leadId = null) {
            const basePayload = {
                id: leadId || candidateData.leadId || undefined,
                phone: candidateData.phone,
                fullName: candidateData.fullName,
                fatherName: candidateData.fatherName,
                email: candidateData.email,
                cnic: candidateData.cnic,
                city: candidateData.city,
                dob: candidateData.dob,
                graduation: candidateData.graduation,
                position: candidateData.position,
                referredBy: candidateData.referredBy || 'Walk-in',
                user_role: 'Reception'
            };

            try {
                let toHr = await updateLeadStage({
                    ...basePayload,
                    new_stage: 'interview_conducted',
                    action: 'reception_send_hr',
                    remark: `Interview conducted - sent to HR queue ${new Date().toLocaleString()}`
                });
                if (!toHr.success) {
                    const checkIn = await updateLeadStage({
                        ...basePayload,
                        new_stage: 'receptionist',
                        action: 'reception_checkin',
                        remark: `Checked in at reception - slot assigned ${new Date().toLocaleString()}`
                    });
                    if (!checkIn.success) {
                        showToast(checkIn.error || toHr.error || 'Check-in failed', 'error');
                        return false;
                    }
                    const lid = checkIn.data?.lead_id || leadId;
                    toHr = await updateLeadStage({
                        ...basePayload,
                        id: lid,
                        new_stage: 'interview_conducted',
                        action: 'reception_send_hr',
                        remark: `Interview conducted - sent to HR queue ${new Date().toLocaleString()}`
                    });
                }
                if (toHr.success) {
                    showToast(`✅ ${candidateData.fullName} sent to HR interview queue`, 'success');
                    await mirrorCandidateToSheet({ ...candidateData, status: 'interview_conducted' }, 'reception_send_to_hr');
                    return true;
                }
                showToast(toHr.error || 'Failed to send to HR', 'error');
            } catch (e) {
                showToast('Failed to save candidate to database', 'error');
            }
            return false;
        }

        async function markScheduledNotAppeared(leadId, name, phone) {
            const data = await updateLeadStage({
                id: leadId,
                phone,
                new_stage: 'not_appeared',
                action: 'reception_no_show',
                remark: `Did not appear at reception on ${new Date().toLocaleString()}`,
                user_role: 'Reception'
            });
            if (data.success) {
                showToast(`${name} marked as Not Appeared`, 'warning');
                await loadData();
                showScheduledLeads();
            } else {
                showToast(data.error || 'Update failed', 'error');
            }
        }

        async function checkInScheduled(leadId, name, phone) {
            const data = await updateLeadStage({
                id: leadId,
                phone,
                new_stage: 'receptionist',
                action: 'reception_checkin',
                remark: `${name} appeared at reception - time slot assigned`,
                user_role: 'Reception'
            });
            if (data.success) {
                showToast(`✅ ${name} checked in at reception`, 'success');
                await loadData();
                showScheduledLeads();
            } else {
                showToast(data.error || 'Check-in failed', 'error');
            }
        }

        async function submitWalkin() {
            const fullName = document.getElementById('walkinName')?.value?.trim();
            const fatherName = document.getElementById('walkinFather')?.value?.trim();
            const phone = document.getElementById('walkinPhone')?.value?.trim();
            const email = document.getElementById('walkinEmail')?.value?.trim();
            const cnic = document.getElementById('walkinCnic')?.value?.trim();
            const city = document.getElementById('walkinCity')?.value?.trim();
            const dob = document.getElementById('walkinDob')?.value;
            const qualification = document.getElementById('walkinQualification')?.value;
            const position = document.getElementById('walkinPosition')?.value;
            const referredBy = document.getElementById('walkinReferredBy')?.value || 'Walk-in';

            if (!fullName || !fatherName || !phone || !position) {
                showToast('Please fill all required fields (*)', 'error');
                return;
            }

            if (!/^\d{11}$/.test(phone)) {
                showToast('Please enter 11-digit phone number', 'error');
                return;
            }

            const normalizedPhone = phone.replace(/\D/g, '');
            const matchedScheduled = recruiterLeads.find(l => (String(l.phone || '').replace(/\D/g, '') === normalizedPhone));

            const candidateForHR = {
                id: Date.now(),
                fullName: fullName,
                fatherName: fatherName,
                phone: phone,
                email: email || '',
                cnic: cnic || '',
                city: city || '',
                dob: dob || '',
                graduation: qualification || '',
                position: position,
                joiningDate: new Date().toISOString().split('T')[0],
                referredBy: referredBy,
                source: 'walkin',
                registeredAt: new Date().toISOString()
            };

            if (matchedScheduled && matchedScheduled.id) {
                await sendToHR({ ...candidateForHR, leadId: matchedScheduled.id }, matchedScheduled.id);
                showToast(`Matched scheduled interview for ${matchedScheduled.fullName || matchedScheduled.name} by phone`, 'success');
                await loadData();
                return;
            }

            walkinCandidates.push({ ...candidateForHR, registeredAt: new Date().toISOString() });
            await sendToHR(candidateForHR);
            await loadData();
            
            document.getElementById('walkinName').value = '';
            document.getElementById('walkinFather').value = '';
            document.getElementById('walkinPhone').value = '';
            document.getElementById('walkinEmail').value = '';
            document.getElementById('walkinCnic').value = '';
            document.getElementById('walkinCity').value = '';
            document.getElementById('walkinDob').value = '';
            document.getElementById('walkinQualification').value = '';
            document.getElementById('walkinPosition').value = '';

        function showQRCode() {
            const display = document.getElementById('qrCodeDisplay');
            const qrDiv = document.getElementById('qrcode');
            
            if (!qrGenerated) {
                qrDiv.innerHTML = '';
                const currentUrl = window.location.href;
                const mobileUrl = currentUrl.substring(0, currentUrl.lastIndexOf('/')) + '/candidate-form.html';
                
                new QRCode(qrDiv, {
                    text: mobileUrl,
                    width: 160,
                    height: 160,
                    colorDark: "#f97316",
                    colorLight: "#ffffff",
                    correctLevel: QRCode.CorrectLevel.H
                });
                qrGenerated = true;
            }
            display.classList.remove('hidden');
        }

        function copyMobileLink() {
            const currentUrl = window.location.href;
            const mobileUrl = currentUrl.substring(0, currentUrl.lastIndexOf('/')) + '/candidate-form.html';
            navigator.clipboard.writeText(mobileUrl).then(() => {
                showToast('✅ Mobile form link copied!', 'success');
            }).catch(() => {
                showToast('❌ Failed to copy link', 'error');
            });
        }

                const qrImg = document.querySelector('#qrcode img');

                    const link = document.createElement('a');
                    link.download = 'balitech-interview-qr.png';
                    link.href = qrImg.src;
                    link.click();
                    showToast('✅ QR Code downloaded', 'success');
                } else {
                    showToast('❌ Please show QR code first', 'warning');
                }
            }, 500);
        }

        function showToast(message, type = 'success') {
            const container = document.getElementById('toastContainer');
            const toast = document.createElement('div');
            toast.className = 'toast';
            const icon = type === 'success' ? 'fa-check-circle' : type === 'error' ? 'fa-exclamation-circle' : 'fa-info-circle';
            toast.innerHTML = `<i class="fas ${icon}" style="color: var(--${type === 'success' ? 'secondary' : 'danger'})"></i> ${message}`;
            container.appendChild(toast);
            setTimeout(() => toast.classList.add('show'), 10);
            setTimeout(() => {

        async function sendScheduledToHR(id, name, phone, position) {
            const lead = recruiterLeads.find(l => l.id === id);
            if (!lead) return;

            const candidateForHR = {
                leadId: id,
                fullName: name,
                fatherName: lead.fatherName || '',
                phone: phone,
                email: lead.email || '',
                cnic: lead.cnic || '',
                city: lead.city || '',
                dob: lead.dob || '',
                graduation: lead.graduation || '',
                position: position,
                referredBy: lead.referredBy || 'Recruiter',
                source: 'recruiter'
            };

            const ok = await sendToHR(candidateForHR, id);
            if (ok) {
                try {
                    if (lead.interviewId) {
                        await fetch('api/complete_interview.php', {
                            method: 'POST',
                            credentials: 'include',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ interview_id: lead.interviewId })
                        });
                    }
                } catch (e) {
                    console.warn('Interview completion sync skipped', e);
                }
                await loadData();
                showScheduledLeads();
            }
        }

        let walkinCnicTimer = null;
        let lastWalkinCheckedCnic = '';

        window.handleWalkinCnic = function(val, immediate = false) {
            const digits = (val || '').replace(/[^0-9]/g, '');
            const alertBox = document.getElementById('walkinCnicAlertBox');
            const spinner = document.getElementById('walkinCnicSpinner');
            
            if (digits.length < 13) {
                if (digits.length === 0 && alertBox) {
                    alertBox.style.display = 'none';
                }
                return;
            }

            if (digits === lastWalkinCheckedCnic && !immediate) return;

            clearTimeout(walkinCnicTimer);
            const runCheck = async () => {
                lastWalkinCheckedCnic = digits;
                if (spinner) spinner.style.display = 'inline';
                
                try {
                    const res = await fetch('api/verify_candidate_cnic.php?cnic=' + encodeURIComponent(digits), {
                        credentials: 'include'
                    });
                    const data = await res.json();
                    if (spinner) spinner.style.display = 'none';
                    
                    if (data.success && data.data) {
                        const d = data.data;
                        if (d.has_rejection) {
                            const rej = d.history.find(h => h.is_rejected) || d.history[0];
                            alertBox.style.display = 'block';
                            alertBox.style.background = 'rgba(239, 68, 68, 0.15)';
                            alertBox.style.border = '1px solid rgba(239, 68, 68, 0.5)';
                            alertBox.style.color = '#fca5a5';
                            alertBox.innerHTML = `
                                <div style="display:flex; justify-content:space-between; align-items:flex-start; gap:12px;">
                                    <div style="display:flex; gap:12px; align-items:flex-start;">
                                        <i class="fas fa-exclamation-triangle" style="font-size:22px; color:#ef4444; margin-top:2px;"></i>
                                        <div>
                                            <div style="font-weight:700; font-size:14px; color:#f87171;">⚠️ Candidate Previously Rejected at Another Branch!</div>
                                            <div style="margin-top:5px; font-size:12px; color:#e2e8f0;">
                                                <strong>Branch:</strong> <span style="color:#fb923c;">${rej ? rej.branch_label : 'Main Branch'}</span> &nbsp;|&nbsp;
                                                <strong>Date:</strong> ${rej ? rej.applied_date : 'Past'} &nbsp;|&nbsp;
                                                <strong>Status:</strong> <span style="background:rgba(239,68,68,0.3); padding:2px 8px; border-radius:4px; font-weight:600; color:#fff;">${rej ? rej.status_title : 'Rejected'}</span>
                                            </div>
                                            ${rej && rej.rejection_reason ? `<div style="margin-top:4px; font-size:12px; color:#fed7aa;"><strong>Rejection Reason:</strong> ${rej.rejection_reason}</div>` : ''}
                                            ${rej && rej.remarks && rej.remarks.length ? `<div style="margin-top:4px; font-size:11px; opacity:0.85;"><strong>Interviewer Remarks:</strong> "${rej.remarks[0].text}"</div>` : ''}
                                        </div>
                                    </div>
                                    <button type="button" class="btn btn-warning" style="padding:6px 12px; font-size:11px; border-radius:8px; white-space:nowrap;" onclick="showCrossBranchModal(0, '${digits}')">
                                        <i class="fas fa-history"></i> Full History
                                    </button>
                                </div>
                            `;
                        } else if (d.has_history) {
                            const first = d.history[0];
                            alertBox.style.display = 'block';
                            alertBox.style.background = 'rgba(245, 158, 11, 0.15)';
                            alertBox.style.border = '1px solid rgba(245, 158, 11, 0.4)';
                            alertBox.style.color = '#fde68a';
                            alertBox.innerHTML = `
                                <div style="display:flex; justify-content:space-between; align-items:center; gap:10px;">
                                    <div>
                                        <i class="fas fa-info-circle" style="color:#f59e0b; margin-right:6px;"></i>
                                        <strong>Candidate Applied Previously:</strong> ${first ? first.branch_label : 'Other Branch'} (${first ? first.applied_date : ''}) - Status: ${first ? first.status_title : ''}
                                    </div>
                                    <button type="button" class="btn btn-warning" style="padding:4px 10px; font-size:11px; border-radius:8px;" onclick="showCrossBranchModal(0, '${digits}')">View</button>
                                </div>
                            `;
                        } else {
                            alertBox.style.display = 'none';
                        }

                        // Auto-fill past personal details if blank
                        if (d.history && d.history.length > 0) {
                            const prev = d.history[0];
                            const nameInput = document.getElementById('walkinName');
                            const fatherInput = document.getElementById('walkinFather');
                            const phoneInput = document.getElementById('walkinPhone');
                            const emailInput = document.getElementById('walkinEmail');
                            const cityInput = document.getElementById('walkinCity');
                            
                            if (nameInput && !nameInput.value && prev.full_name) nameInput.value = prev.full_name;
                            if (fatherInput && !fatherInput.value && prev.father_name) fatherInput.value = prev.father_name;
                            if (phoneInput && !phoneInput.value && prev.phone) phoneInput.value = prev.phone;
                            if (emailInput && !emailInput.value && prev.email) emailInput.value = prev.email;
                            if (cityInput && !cityInput.value && prev.city) cityInput.value = prev.city;
                        }
                    }
                } catch (err) {
                    console.warn('Reception CNIC check error:', err);
                    if (spinner) spinner.style.display = 'none';
                }
            };

            if (immediate) {
                runCheck();
            } else {
                walkinCnicTimer = setTimeout(runCheck, 350);
            }
        };

        window.showCrossBranchModal = async function(leadId, cnic) {

                    <div id="crossBranchModalBody">
                        <div style="text-align:center; padding:30px; color:var(--text-muted);">
                            <i class="fas fa-spinner fa-spin fa-2x"></i>
                            <p style="margin-top:10px;">Fetching past records across all branches...</p>
                        </div>
                    </div>
                </div>
            `;
            document.body.appendChild(modal);

            try {
                const url = leadId ? `api/verify_candidate_cnic.php?lead_id=${leadId}` : `api/verify_candidate_cnic.php?cnic=${encodeURIComponent(cnic)}`;
                const res = await fetch(url, { credentials: 'include' });
                const data = await res.json();
                const container = document.getElementById('crossBranchModalBody');
                if (!container) return;

                if (!data.success || !data.data || data.data.history.length === 0) {

                            <p style="font-size:13px; margin-top:5px;">This candidate has no recorded previous attempts or rejections in other branches.</p>
                        </div>
                    `;
                    return;
                }

                const d = data.data;
                container.innerHTML = `
                    <div style="margin-bottom:20px; padding:14px; border-radius:12px; ${d.has_rejection ? 'background:rgba(239,68,68,0.15); border:1px solid rgba(239,68,68,0.3); color:#fca5a5;' : 'background:rgba(59,130,246,0.1); border:1px solid rgba(59,130,246,0.3); color:#93c5fd;'}">
                        <strong>${d.summary}</strong>
                    </div>
                    <div style="display:flex; flex-direction:column; gap:16px;">
                        ${d.history.map(item => `
                            <div style="background:var(--bg-sidebar); border-radius:16px; padding:18px; border:1px solid ${item.is_rejected ? 'rgba(239,68,68,0.4)' : 'var(--border-light)'};">
                                <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:10px; margin-bottom:12px;">
                                    <div>
                                        <span style="font-size:16px; font-weight:700; color:#fff;">${item.full_name}</span>
                                        <span style="margin-left:10px; font-size:12px; padding:2px 8px; border-radius:6px; background:rgba(249,115,22,0.15); color:var(--primary); font-weight:600;">
                                            <i class="fas fa-building"></i> ${item.branch_label}
                                        </span>
                                    </div>
                                    <div style="padding:4px 10px; border-radius:20px; font-size:12px; font-weight:700; ${item.is_rejected ? 'background:#ef4444; color:#fff;' : 'background:var(--secondary); color:#fff;'}">
                                        ${item.status_title}
                                    </div>
                                </div>
                                <div style="display:grid; grid-template-columns:repeat(auto-fit, minmax(180px, 1fr)); gap:8px; font-size:12px; color:var(--text-muted); margin-bottom:12px;">
                                    <div><i class="fas fa-id-card"></i> CNIC: <strong style="color:var(--text-secondary);">${item.cnic || 'N/A'}</strong></div>
                                    <div><i class="fas fa-phone"></i> Phone: <strong style="color:var(--text-secondary);">${item.phone || 'N/A'}</strong></div>
                                    <div><i class="fas fa-briefcase"></i> Position: <strong style="color:var(--text-secondary);">${item.position || 'N/A'}</strong></div>
                                    <div><i class="fas fa-calendar"></i> Applied Date: <strong style="color:var(--text-secondary);">${item.applied_date}</strong></div>
                                </div>
                                ${item.rejection_reason ? `
                                    <div style="padding:10px 12px; background:rgba(239,68,68,0.1); border-radius:8px; font-size:12px; color:#fca5a5; margin-bottom:10px;">
                                        <strong><i class="fas fa-times-circle"></i> Rejection Reason:</strong> ${item.rejection_reason}
                                    </div>
                                ` : ''}
                                ${item.remarks && item.remarks.length > 0 ? `
                                    <div style="margin-top:10px;">
                                        <div style="font-size:11px; font-weight:700; text-transform:uppercase; color:var(--text-muted); margin-bottom:6px;">Interviewer Remarks:</div>
                                        ${item.remarks.map(r => `
                                            <div style="padding:8px 12px; background:rgba(255,255,255,0.03); border-left:3px solid var(--primary); border-radius:4px; font-size:12px; margin-bottom:4px;">
                                                <div style="color:var(--text-secondary);">${r.text}</div>
                                                <div style="font-size:10px; color:var(--text-muted); margin-top:2px;">— ${r.by} (${r.role || 'HR/Agent'}) on ${new Date(r.date).toLocaleString()}</div>
                                            </div>
                                        `).join('')}
                                    </div>
                                ` : ''}
                            </div>
                        `).join('')}
                    </div>
                `;
            } catch (e) {
                const container = document.getElementById('crossBranchModalBody');
                if (container) {
                    container.innerHTML = `<div style="color:var(--danger); padding:20px; text-align:center;">Failed to load candidate history: ${e.message}</div>`;
                }
            }
        };

        window.showDashboard = showDashboard;
        window.showScheduledLeads = showScheduledLeads;
        window.callCandidate = callCandidate;
        window.initializeVoice = initializeVoice;
        window.toggleTheme = toggleTheme;
        window.submitWalkin = submitWalkin;
        window.showQRCode = showQRCode;
        window.copyMobileLink = copyMobileLink;
        window.downloadQRCode = downloadQRCode;
        window.forceSync = forceSync;
        window.verifySync = verifySync;
        window.showSyncStats = showSyncStats;
        window.logout = logout;
        window.sendScheduledToHR = sendScheduledToHR;
        window.testVoice = testVoice;
        window.toggleCustomPositionInput = toggleCustomPositionInput;
        window.handleAddCustomPosition = handleAddCustomPosition;
        window.populatePositionsDropdown = populatePositionsDropdown;
        window.toggleCustomReferralInput = toggleCustomReferralInput;
        window.handleAddCustomReferral = handleAddCustomReferral;
        window.populateReferralsDropdown = populateReferralsDropdown;
        window.handleWalkinCnic = handleWalkinCnic;
        window.showCrossBranchModal = showCrossBranchModal;
    </script>
    <script src="js/portal-chat-fab.js"></script>
</body>
</html>
