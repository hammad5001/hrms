<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Balitech - Management Portal | Final Interview</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="css/dropdown-fix.css">
    <link rel="stylesheet" href="css/portal-ui-polish.css?v=1">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        :root {
            --primary: #f97316;
            --primary-dark: #ea580c;
            --primary-light: rgba(249, 115, 22, 0.1);
            --primary-glow: rgba(249, 115, 22, 0.2);
            --secondary: #10b981;
            --secondary-dark: #059669;
            --secondary-light: rgba(16, 185, 129, 0.1);
            --danger: #ef4444;
            --danger-light: rgba(239, 68, 68, 0.1);
            --warning: #f59e0b;
            --warning-light: rgba(245, 158, 11, 0.1);
            --info: #3b82f6;
            --info-light: rgba(59, 130, 246, 0.1);
            --purple: #8b5cf6;
            --purple-light: rgba(139, 92, 246, 0.1);
            --pink: #ec4899;
            --pink-light: rgba(236, 72, 153, 0.1);
            --bg-primary: #0b0f19;
            --bg-secondary: #111726;
            --bg-tertiary: #161e31;
            --bg-card: rgba(22, 30, 49, 0.85);
            --bg-input: #1a233a;
            --bg-sidebar: #0d1220;
            --text-primary: #f8fafc;
            --text-secondary: #cbd5e1;
            --text-muted: #8492a6;
            --text-dim: #526079;
            --border-primary: rgba(249, 115, 22, 0.18);
            --border-secondary: rgba(255, 255, 255, 0.06);
            --shadow-sm: 0 2px 4px rgba(0, 0, 0, 0.2);
            --shadow-md: 0 4px 12px rgba(0, 0, 0, 0.25);
            --shadow-lg: 0 10px 24px rgba(0, 0, 0, 0.35);
            --shadow-xl: 0 16px 36px rgba(0, 0, 0, 0.45);
            --shadow-2xl: 0 24px 48px rgba(0, 0, 0, 0.6);
            --shadow-glow: 0 0 16px var(--primary-glow);
            --gradient-primary: linear-gradient(135deg, #f97316, #fb923c);
            --gradient-success: linear-gradient(135deg, #10b981, #34d399);
            --gradient-danger: linear-gradient(135deg, #ef4444, #f87171);
            --gradient-purple: linear-gradient(135deg, #8b5cf6, #a78bfa);
            --gradient-blue: linear-gradient(135deg, #3b82f6, #60a5fa);
        }

        [data-theme="light"] {
            --primary: #f97316;
            --primary-dark: #ea580c;
            --primary-light: rgba(249, 115, 22, 0.08);
            --bg-primary: #f1f5f9;
            --bg-secondary: #f8fafc;
            --bg-tertiary: #ffffff;
            --bg-card: #ffffff;
            --bg-input: #f8fafc;
            --bg-sidebar: #1e293b;
            --text-primary: #0f172a;
            --text-secondary: #334155;
            --text-muted: #64748b;
            --border-primary: rgba(249, 115, 22, 0.2);
            --border-secondary: rgba(0, 0, 0, 0.06);
            --shadow-2xl: 0 16px 36px rgba(0, 0, 0, 0.1);
        }

        body {
            background: var(--bg-primary);
            min-height: 100vh;
            display: flex;
            position: relative;
            overflow-x: hidden;
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: radial-gradient(circle at 15% 20%, rgba(249, 115, 22, 0.04) 0%, transparent 45%),
                        radial-gradient(circle at 85% 80%, rgba(139, 92, 246, 0.03) 0%, transparent 45%),
                        linear-gradient(145deg, var(--bg-primary) 0%, var(--bg-secondary) 100%);
            z-index: -2;
        }

        body::after {
            content: '';
            position: fixed;
            width: 400px;
            height: 400px;
            background: radial-gradient(circle, rgba(249, 115, 22, 0.04) 0%, transparent 70%);
            top: -150px;
            right: -150px;
            border-radius: 50%;
            filter: blur(50px);
            animation: float 20s ease-in-out infinite;
            z-index: -1;
        }

        .orb-2 {
            position: fixed;
            width: 450px;
            height: 450px;
            background: radial-gradient(circle, rgba(139, 92, 246, 0.03) 0%, transparent 70%);
            bottom: -200px;
            left: -150px;
            border-radius: 50%;
            filter: blur(50px);
            animation: float 25s ease-in-out infinite reverse;
            z-index: -1;
        }

        @keyframes float {
            0%, 100% { transform: translate(0, 0) scale(1); }
            50% { transform: translate(40px, 20px) scale(1.05); }
        }

        .sidebar {
            width: 240px;
            background: var(--bg-sidebar);
            backdrop-filter: blur(14px);
            color: white;
            height: 100vh;
            position: fixed;
            left: 0;
            top: 0;
            overflow-y: auto;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 4px 0 20px rgba(0, 0, 0, 0.35);
            z-index: 100;
            border-right: 1px solid var(--border-secondary);
            display: flex;
            flex-direction: column;
        }

        .sidebar-header {
            padding: 20px 18px;
            border-bottom: 1px solid var(--border-secondary);
            text-align: left;
            position: relative;
            overflow: hidden;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .sidebar-header::before {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 1px;
            background: linear-gradient(90deg, transparent, var(--primary), transparent);
            animation: shimmer 3s infinite;
        }

        @keyframes shimmer {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(100%); }
        }

        .sidebar-logo-icon {
            width: 38px;
            height: 38px;
            min-width: 38px;
            background: var(--gradient-primary);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-size: 18px;
            box-shadow: 0 4px 12px var(--primary-glow);
        }

        .sidebar-logo {
            font-size: 19px;
            font-weight: 800;
            letter-spacing: 0.5px;
            margin-bottom: 2px;
            background: linear-gradient(135deg, #fff, #e2e8f0);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .sidebar-logo span {
            background: var(--gradient-primary);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .sidebar-sub {
            font-size: 11px;
            color: var(--text-muted);
            letter-spacing: 0.3px;
            font-weight: 500;
        }

        .sidebar-menu {
            padding: 14px 10px;
            flex: 1;
        }

        .menu-item {
            padding: 10px 14px;
            display: flex;
            align-items: center;
            gap: 10px;
            color: var(--text-muted);
            cursor: pointer;
            transition: all 0.2s ease;
            border-radius: 10px;
            margin-bottom: 4px;
            font-size: 13px;
            font-weight: 500;
            border: 1px solid transparent;
        }

        .menu-item:hover {
            background: rgba(249, 115, 22, 0.08);
            color: var(--primary);
            border-color: rgba(249, 115, 22, 0.15);
            transform: translateX(3px);
        }

        .menu-item.active {
            background: linear-gradient(90deg, rgba(249, 115, 22, 0.16), rgba(249, 115, 22, 0.04));
            color: #fb923c;
            border-color: rgba(249, 115, 22, 0.25);
            font-weight: 600;
        }

        .menu-item i {
            width: 18px;
            font-size: 15px;
            text-align: center;
        }

        .menu-item span {
            font-size: 13px;
        }

        .menu-badge {
            margin-left: auto;
            background: var(--gradient-primary);
            color: white;
            padding: 2px 8px;
            border-radius: 12px;
            font-size: 10px;
            font-weight: 700;
            box-shadow: 0 2px 6px rgba(249, 115, 22, 0.3);
        }

        .sidebar-footer {
            padding: 14px 12px;
            border-top: 1px solid var(--border-secondary);
            background: rgba(10, 15, 28, 0.4);
        }

        .user-info {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 8px 10px;
            background: var(--bg-tertiary);
            border-radius: 12px;
            border: 1px solid var(--border-secondary);
        }

        .user-avatar {
            width: 34px;
            height: 34px;
            min-width: 34px;
            background: var(--gradient-primary);
            border-radius: 9px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 15px;
            color: white;
            box-shadow: 0 2px 8px var(--primary-glow);
        }

        .user-details h5 {
            font-size: 12px;
            font-weight: 700;
            margin-bottom: 1px;
            color: var(--text-primary);
            line-height: 1.2;
        }

        .user-details p {
            font-size: 10px;
            color: var(--text-muted);
            line-height: 1.2;
        }

        .main-content {
            flex: 1;
            margin-left: 240px;
            padding: 20px 24px;
            position: relative;
            z-index: 1;
            max-width: 1500px;
        }

        .top-header {
            background: var(--bg-card);
            backdrop-filter: blur(14px);
            border-radius: 16px;
            padding: 14px 20px;
            margin-bottom: 18px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: var(--shadow-md);
            border: 1px solid var(--border-secondary);
            position: relative;
            overflow: hidden;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .header-logo {
            width: 38px;
            height: 38px;
            background: var(--gradient-primary);
            border-radius: 11px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 18px;
            box-shadow: 0 4px 12px var(--primary-glow);
        }

        .header-title h2 {
            font-size: 17px;
            color: var(--text-primary);
            margin-bottom: 2px;
            font-weight: 700;
            letter-spacing: -0.2px;
        }

        .header-title p {
            font-size: 11px;
            color: var(--text-muted);
            font-weight: 500;
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        .theme-toggle {
            width: 34px;
            height: 34px;
            border-radius: 10px;
            background: var(--bg-tertiary);
            border: 1px solid var(--border-secondary);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s ease;
            color: var(--text-primary);
            font-size: 14px;
        }

        .theme-toggle:hover {
            background: var(--primary);
            color: white;
            border-color: var(--primary);
            transform: scale(1.05);
        }

        .action-btn {
            padding: 7px 14px;
            border: 1px solid var(--border-secondary);
            border-radius: 20px;
            background: var(--bg-tertiary);
            color: var(--text-secondary);
            font-weight: 600;
            font-size: 12px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: all 0.2s ease;
        }

        .action-btn:hover {
            background: var(--primary);
            border-color: var(--primary);
            color: white;
            transform: translateY(-1px);
            box-shadow: 0 4px 12px var(--primary-glow);
        }

        .action-btn.primary {
            background: var(--gradient-primary);
            color: white;
            border: none;
            box-shadow: 0 4px 12px var(--primary-glow);
        }

        .gsheets-status {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 6px 12px;
            background: var(--bg-tertiary);
            border-radius: 20px;
            border: 1px solid var(--border-secondary);
            color: var(--text-secondary);
            font-size: 11.5px;
            font-weight: 500;
        }

        .gsheets-status i {
            color: var(--primary);
        }

        /* Modern Compact Stats Grid */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 14px;
            margin-bottom: 20px;
        }

        .stat-card {
            background: var(--bg-card);
            backdrop-filter: blur(12px);
            border-radius: 14px;
            padding: 14px 16px;
            box-shadow: var(--shadow-sm);
            border: 1px solid var(--border-secondary);
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .stat-card:hover {
            transform: translateY(-2px);
            border-color: rgba(249, 115, 22, 0.35);
            box-shadow: var(--shadow-md);
        }

        .stat-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 3px;
            height: 100%;
            background: var(--gradient-primary);
            opacity: 0.8;
        }

        .stat-card:nth-child(2)::before { background: var(--gradient-purple); }
        .stat-card:nth-child(3)::before { background: var(--gradient-success); }
        .stat-card:nth-child(4)::before { background: var(--gradient-danger); }

        .stat-icon {
            width: 40px;
            height: 40px;
            min-width: 40px;
            background: var(--primary-light);
            border-radius: 11px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--primary);
            font-size: 17px;
            margin-bottom: 0;
            border: 1px solid rgba(249, 115, 22, 0.15);
        }

        .stat-card:nth-child(2) .stat-icon {
            background: var(--purple-light);
            color: var(--purple);
            border-color: rgba(139, 92, 246, 0.2);
        }

        .stat-card:nth-child(3) .stat-icon {
            background: var(--secondary-light);
            color: var(--secondary);
            border-color: rgba(16, 185, 129, 0.2);
        }

        .stat-card:nth-child(4) .stat-icon {
            background: var(--danger-light);
            color: var(--danger);
            border-color: rgba(239, 68, 68, 0.2);
        }

        .stat-content {
            flex: 1;
        }

        .stat-label {
            font-size: 11.5px;
            font-weight: 600;
            color: var(--text-muted);
            margin-bottom: 2px;
            text-transform: uppercase;
            letter-spacing: 0.4px;
        }

        .stat-value {
            font-size: 22px;
            font-weight: 800;
            color: var(--text-primary);
            line-height: 1.1;
            font-feature-settings: "tnum";
        }

        .dashboard-grid {
            display: grid;
            grid-template-columns: 1.15fr 0.85fr;
            gap: 16px;
        }

        .dashboard-card {
            background: var(--bg-card);
            backdrop-filter: blur(14px);
            border-radius: 16px;
            padding: 16px 18px;
            box-shadow: var(--shadow-md);
            border: 1px solid var(--border-secondary);
            display: flex;
            flex-direction: column;
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            padding-bottom: 10px;
            border-bottom: 1px solid var(--border-secondary);
        }

        .card-header h3 {
            font-size: 14.5px;
            color: var(--text-primary);
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: 700;
            letter-spacing: -0.2px;
        }

        .card-header h3 i {
            color: var(--primary);
            font-size: 14px;
        }

        .card-badge {
            padding: 3px 9px;
            background: var(--primary-light);
            color: var(--primary);
            border-radius: 12px;
            font-size: 11px;
            font-weight: 700;
            border: 1px solid rgba(249, 115, 22, 0.2);
        }

        .search-box {
            position: relative;
            margin-bottom: 12px;
        }

        .search-box i {
            position: absolute;
            left: 12px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
            z-index: 1;
            font-size: 13px;
        }

        .search-box input {
            width: 100%;
            padding: 8px 12px 8px 34px;
            background: var(--bg-input);
            border: 1px solid var(--border-secondary);
            border-radius: 10px;
            font-size: 12.5px;
            transition: all 0.2s ease;
            color: var(--text-primary);
        }

        .search-box input:focus {
            border-color: var(--primary);
            outline: none;
            background: var(--bg-tertiary);
            box-shadow: 0 0 0 3px var(--primary-light);
        }

        .candidate-list {
            max-height: calc(100vh - 290px);
            min-height: 320px;
            overflow-y: auto;
            padding-right: 4px;
        }

        .candidate-list::-webkit-scrollbar {
            width: 5px;
        }

        .candidate-list::-webkit-scrollbar-track {
            background: transparent;
        }

        .candidate-list::-webkit-scrollbar-thumb {
            background: var(--border-secondary);
            border-radius: 10px;
        }

        .candidate-list::-webkit-scrollbar-thumb:hover {
            background: var(--primary);
        }

        /* Compact & Sleek Candidate Card */
        .candidate-item {
            background: var(--bg-tertiary);
            border: 1px solid var(--border-secondary);
            border-radius: 12px;
            padding: 13px 15px;
            margin-bottom: 10px;
            transition: all 0.2s ease;
            position: relative;
            overflow: hidden;
        }

        .candidate-item:hover {
            border-color: rgba(249, 115, 22, 0.4);
            background: rgba(26, 35, 58, 0.9);
            transform: translateY(-1px);
            box-shadow: 0 4px 14px rgba(0, 0, 0, 0.25);
        }

        .candidate-item::before {
            content: '';
            position: absolute;
            left: 0;
            top: 0;
            height: 100%;
            width: 3px;
            background: var(--gradient-primary);
            opacity: 0;
            transition: opacity 0.2s ease;
        }

        .candidate-item:hover::before {
            opacity: 1;
        }

        .candidate-header {
            display: flex;
            align-items: center;
            gap: 11px;
            margin-bottom: 10px;
        }

        .candidate-avatar {
            width: 38px;
            height: 38px;
            min-width: 38px;
            background: linear-gradient(135deg, rgba(249, 115, 22, 0.2), rgba(249, 115, 22, 0.05));
            border: 1px solid rgba(249, 115, 22, 0.25);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--primary);
            font-size: 15px;
        }

        .candidate-info {
            flex: 1;
            min-width: 0;
        }

        .candidate-info h4 {
            font-size: 14px;
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: 3px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .candidate-tags {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
            align-items: center;
        }

        .tag {
            padding: 2px 8px;
            border-radius: 6px;
            font-size: 10.5px;
            font-weight: 600;
            background: var(--bg-input);
            color: var(--text-secondary);
            border: 1px solid var(--border-secondary);
        }

        .tag.campaign {
            background: rgba(249, 115, 22, 0.12);
            color: #fb923c;
            border-color: rgba(249, 115, 22, 0.25);
        }

        .info-highlight {
            background: rgba(16, 185, 129, 0.1);
            color: #34d399;
            padding: 2px 8px;
            border-radius: 6px;
            font-size: 10.5px;
            font-weight: 600;
            display: inline-block;
            border: 1px solid rgba(16, 185, 129, 0.25);
        }

        .candidate-details {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 6px 12px;
            margin: 8px 0;
            padding: 8px 10px;
            background: rgba(10, 15, 28, 0.35);
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.03);
        }

        .detail-item {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 11px;
            color: var(--text-secondary);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .detail-item i {
            color: var(--primary);
            width: 13px;
            font-size: 11px;
            opacity: 0.85;
        }

        .remarks-preview {
            margin-top: 8px;
            padding: 8px 10px;
            background: rgba(10, 15, 28, 0.4);
            border-radius: 8px;
            font-size: 11.5px;
            border-left: 2px solid var(--primary);
            border-top: 1px solid var(--border-secondary);
            border-right: 1px solid var(--border-secondary);
            border-bottom: 1px solid var(--border-secondary);
        }

        .remarks-preview-header {
            display: flex;
            align-items: center;
            gap: 5px;
            margin-bottom: 3px;
            color: var(--primary);
            font-weight: 700;
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 0.3px;
        }

        .remarks-preview-item {
            color: var(--text-secondary);
            font-size: 11px;
            line-height: 1.35;
        }

        .action-buttons {
            display: flex;
            gap: 6px;
            margin-top: 10px;
            flex-wrap: wrap;
        }

        .btn {
            flex: 1;
            min-width: 60px;
            padding: 7px 10px;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            font-size: 11px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 5px;
            transition: all 0.2s ease;
        }

        .btn:hover {
            transform: translateY(-1px);
            filter: brightness(1.1);
        }

        .btn-info {
            background: rgba(59, 130, 246, 0.15);
            color: #60a5fa;
            border: 1px solid rgba(59, 130, 246, 0.3);
        }
        .btn-info:hover {
            background: var(--gradient-blue);
            color: #fff;
        }

        .btn-primary {
            background: rgba(249, 115, 22, 0.15);
            color: #fb923c;
            border: 1px solid rgba(249, 115, 22, 0.3);
        }
        .btn-primary:hover {
            background: var(--gradient-primary);
            color: #fff;
        }

        .btn-success {
            background: var(--gradient-success);
            color: white;
            box-shadow: 0 2px 8px rgba(16, 185, 129, 0.3);
        }

        .btn-danger {
            background: rgba(239, 68, 68, 0.15);
            color: #f87171;
            border: 1px solid rgba(239, 68, 68, 0.3);
        }
        .btn-danger:hover {
            background: var(--gradient-danger);
            color: #fff;
        }

        .empty-state {
            text-align: center;
            padding: 40px 15px;
            color: var(--text-muted);
        }

        .empty-state i {
            font-size: 40px;
            color: var(--text-dim);
            margin-bottom: 10px;
            opacity: 0.6;
        }

        .empty-state h4 {
            color: var(--text-secondary);
            font-size: 13.5px;
            margin-bottom: 4px;
            font-weight: 600;
        }

        .empty-state p {
            font-size: 11.5px;
            color: var(--text-muted);
        }

        .selected-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 9px 12px;
            border-radius: 10px;
            background: var(--bg-tertiary);
            border: 1px solid var(--border-secondary);
            margin-bottom: 7px;
            transition: all 0.2s ease;
        }

        .selected-item:hover {
            background: rgba(26, 35, 58, 0.9);
            border-color: rgba(16, 185, 129, 0.3);
        }

        .selected-avatar {
            width: 32px;
            height: 32px;
            min-width: 32px;
            background: rgba(16, 185, 129, 0.12);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--secondary);
            font-size: 13px;
            border: 1px solid rgba(16, 185, 129, 0.25);
        }

        .selected-info {
            flex: 1;
            min-width: 0;
        }

        .selected-info h5 {
            font-size: 12.5px;
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: 1px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .selected-info p {
            font-size: 10.5px;
            color: var(--text-muted);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .selected-status {
            font-size: 10px;
            font-weight: 700;
            padding: 3px 8px;
            border-radius: 12px;
            white-space: nowrap;
        }

        .selected-status.selected {
            background: rgba(16, 185, 129, 0.12);
            color: #34d399;
            border: 1px solid rgba(16, 185, 129, 0.25);
        }

        /* Modal Styles */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.75);
            backdrop-filter: blur(6px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 10000;
            animation: fadeIn 0.15s ease;
        }
        
        .modal {
            background: var(--bg-card);
            border-radius: 18px;
            width: 90%;
            max-width: 480px;
            max-height: 85vh;
            overflow-y: auto;
            box-shadow: var(--shadow-2xl);
            animation: slideUp 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            border: 1px solid var(--border-primary);
        }
        
        .modal-header {
            padding: 16px 20px;
            border-bottom: 1px solid var(--border-secondary);
            display: flex;
            align-items: center;
            gap: 10px;
            position: sticky;
            top: 0;
            background: var(--bg-card);
            z-index: 1;
        }
        
        .modal-header h3 {
            flex: 1;
            margin: 0;
            font-size: 15px;
            font-weight: 700;
            color: var(--text-primary);
        }
        
        .modal-close {
            background: none;
            border: none;
            font-size: 20px;
            cursor: pointer;
            color: var(--text-muted);
            padding: 4px 8px;
            border-radius: 6px;
        }
        
        .modal-close:hover {
            background: var(--bg-tertiary);
            color: var(--primary);
        }
        
        .modal-body {
            padding: 18px 20px;
        }
        
        .modal-footer {
            padding: 14px 20px;
            border-top: 1px solid var(--border-secondary);
            display: flex;
            justify-content: flex-end;
            gap: 8px;
            background: var(--bg-card);
        }
        
        .modal-btn {
            padding: 8px 18px;
            border: none;
            border-radius: 20px;
            font-weight: 600;
            font-size: 12px;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        
        .modal-btn-cancel {
            background: var(--bg-tertiary);
            color: var(--text-secondary);
            border: 1px solid var(--border-secondary);
        }
        
        .modal-btn-primary {
            background: var(--gradient-primary);
            color: white;
            box-shadow: 0 2px 8px var(--primary-glow);
        }
        
        .modal-btn-danger {
            background: var(--gradient-danger);
            color: white;
        }

        textarea {
            width: 100%;
            padding: 12px;
            background: var(--bg-input);
            border: 1px solid var(--border-secondary);
            border-radius: 10px;
            font-size: 13px;
            resize: vertical;
            min-height: 80px;
            color: var(--text-primary);
            font-family: inherit;
        }

        textarea:focus {
            border-color: var(--primary);
            outline: none;
            box-shadow: 0 0 0 3px var(--primary-light);
        }

        .rejection-reasons {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            margin-bottom: 12px;
        }
        
        .rejection-reason {
            padding: 9px 11px;
            background: var(--bg-tertiary);
            border: 1px solid var(--border-secondary);
            border-radius: 8px;
            display: flex;
            align-items: center;
            gap: 6px;
            cursor: pointer;
            transition: all 0.2s ease;
            font-size: 11.5px;
            color: var(--text-secondary);
        }
        
        .rejection-reason:hover {
            border-color: var(--danger);
            background: var(--danger-light);
            color: var(--danger);
        }
        
        .rejection-reason.selected {
            border-color: var(--danger);
            background: var(--danger-light);
            color: var(--danger);
            font-weight: 600;
        }

        .rejection-custom-input {
            width: 100%;
            padding: 10px 12px;
            background: var(--bg-input);
            border: 1px solid var(--border-secondary);
            border-radius: 8px;
            color: var(--text-primary);
            font-size: 12px;
            font-family: inherit;
        }

        .rejection-custom-input:focus {
            border-color: var(--primary);
            outline: none;
        }

        .toast-container {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 20000;
        }

        .toast {
            background: var(--bg-card);
            backdrop-filter: blur(14px);
            border-left: 4px solid var(--secondary);
            border-radius: 10px;
            padding: 12px 18px;
            margin-bottom: 8px;
            box-shadow: var(--shadow-xl);
            display: flex;
            align-items: center;
            gap: 10px;
            transform: translateX(400px);
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            min-width: 260px;
            font-size: 12.5px;
            font-weight: 500;
            color: var(--text-primary);
            border: 1px solid var(--border-secondary);
        }

        .toast.show {
            transform: translateX(0);
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        
        @keyframes slideUp {
            from { transform: translateY(30px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        @media (max-width: 1200px) {
            .stats-grid { grid-template-columns: repeat(2, 1fr); }
            .sidebar { width: 220px; }
            .main-content { margin-left: 220px; }
            .candidate-details { grid-template-columns: repeat(2, 1fr); }
        }

        @media (max-width: 992px) {
            .sidebar { width: 70px; }
            .sidebar-header .sidebar-logo, .sidebar-header .sidebar-sub, .menu-item span, .user-details { display: none; }
            .sidebar-header { justify-content: center; padding: 15px 5px; }
            .menu-item { justify-content: center; padding: 12px; }
            .menu-item i { margin: 0; font-size: 16px; }
            .menu-badge { display: none; }
            .main-content { margin-left: 70px; padding: 15px; }
            .user-info { justify-content: center; padding: 6px; }
            .user-avatar { margin: 0; }
            .dashboard-grid { grid-template-columns: 1fr; }
        }

        @media (max-width: 768px) {
            .stats-grid { grid-template-columns: 1fr 1fr; }
            .candidate-details { grid-template-columns: 1fr; }
            .header-actions { flex-wrap: wrap; }
        }
    </style>
</head>
<body data-theme="dark">

        <!-- Dashboard View (Pending GM + Selected side-by-side) -->

            <div class="dashboard-card" style="width: 100%;">

                    <h3><i class="fas fa-clock" style="color: #f59e0b;"></i> Pending GM Interview Queue</h3>

                </div>

                </div>

                    <span class="card-badge" id="queueSelectedCount">0</span>
                </div>
                <div class="search-box">
                    <i class="fas fa-search"></i>

    <div class="toast-container" id="toastContainer"></div>

    <script src="js/portal-access.js"></script>
    <script src="js/portal-session-guard.js"></script>
    <script src="js/portal-performance.js"></script>
    <script>
        // Global candidates array
        let candidates = [];
        let nextId = 1;
        let lastGmRenderHash = '';
        const GM_CANDIDATES_URL = 'api/get_candidates_global.php?light=1&limit=200&stages=hr_passed,gm_passed,gm_rejected,hired,training,deployed';

        // Google Sheets URL
        const GOOGLE_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwwrodkRzdbcCTy1G8zRwGl5lSTBXJ5Ar-MmWMvLuXgAZOcJ2snOVdn3IMc4xKnhSMk1w/exec';

        async function loadData() {
            try {
                const result = window.PortalFetch
                    ? await PortalFetch.fetchJson(GM_CANDIDATES_URL, { ttlMs: 15000 })
                    : await (await fetch(GM_CANDIDATES_URL, { credentials: 'include' })).json();
                if (result.success && Array.isArray(result.data)) {
                    candidates = result.data;
                }
            } catch (e) {
                console.error("Failed to fetch GM candidates", e);
                candidates = [];
            }
        }

        function saveData() {}

        function syncToGoogleSheets(candidateData) {
            fetch('api/sheets_mirror.php?action=pushCandidate', {
                method: 'POST',
                credentials: 'include',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ event: 'management_sync', candidate: candidateData })
            }).catch(err => console.log('Sync error:', err));
        }

        function forceSync() {
            if (candidates.length > 0) {
                syncToGoogleSheets(candidates[candidates.length - 1]);
                showToast('🔄 Manual sync triggered!', 'success');
            } else {
                showToast('No candidates to sync', 'warning');
            }
        }

        async function addRemark(candidateId, remarkText, addedBy) {
            if (window.PortalFetch) PortalFetch.invalidatePipelineCaches();
            await fetch('api/update_candidate_global.php', {
                method: 'POST',
                credentials: 'include',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ id: candidateId, remark: remarkText, user_role: addedBy })
            });
            return true;
        }

        function showToast(message, type = 'success') {
            const container = document.getElementById('toastContainer');
            const toast = document.createElement('div');
            toast.className = 'toast';
            const icon = type === 'success' ? 'fa-check-circle' : type === 'error' ? 'fa-exclamation-circle' : 'fa-info-circle';
            toast.innerHTML = `<i class="fas ${icon}" style="color: var(--${type === 'success' ? 'secondary' : 'danger'})"></i> ${message}`;
            container.appendChild(toast);
            setTimeout(() => toast.classList.add('show'), 10);
            setTimeout(() => {
                toast.classList.remove('show');
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        }

        function showRemarksModal(candidateId) {
            const candidate = candidates.find(c => c.id === candidateId);
            if (!candidate) return;
            
            const modalHtml = `
                <div class="modal-overlay" id="remarksModal">
                    <div class="modal">
                        <div class="modal-header">
                            <i class="fas fa-comments" style="color: var(--primary); font-size: 24px;"></i>
                            <h3>Remarks - ${candidate.fullName}</h3>
                            <button class="modal-close" onclick="closeModal()">×</button>
                        </div>
                        <div class="modal-body">
                            <textarea id="newRemark" placeholder="Add your GM interview remarks..."></textarea>
                            <button class="btn btn-success" onclick="saveRemark(${candidateId})" style="width: 100%; margin-top: 15px;">
                                <i class="fas fa-plus"></i> Add Remark
                            </button>
                            <div style="margin-top: 20px;">
                                <h4 style="margin-bottom: 10px;">Previous Remarks</h4>
                                <div id="remarksList">
                                    ${candidate.remarks && candidate.remarks.length > 0 ? 
                                        candidate.remarks.slice().reverse().map(r => `
                                            <div style="padding: 10px; background: var(--bg-input); border-radius: 8px; margin-bottom: 8px;">
                                                <div style="display: flex; justify-content: space-between; font-size: 11px;">
                                                    <strong>${r.addedBy || 'System'}</strong>
                                                    <span style="color: var(--text-muted);">${new Date(r.timestamp).toLocaleString()}</span>
                                                </div>
                                                <div style="font-size: 13px; margin-top: 5px;">${r.text}</div>
                                            </div>
                                        `).join('') : 
                                        '<p style="color: var(--text-muted);">No remarks yet</p>'
                                    }
                                </div>
                            </div>
                        </div>
                        <div class="modal-footer">
                            <button class="modal-btn modal-btn-cancel" onclick="closeModal()">Close</button>
                        </div>
                    </div>
                </div>
            `;
            document.body.insertAdjacentHTML('beforeend', modalHtml);
        }

        async function saveRemark(candidateId) {
            const remark = document.getElementById('newRemark')?.value?.trim();
            if (!remark) {
                showToast('Please enter a remark', 'warning');
                return;
            }
            await addRemark(candidateId, remark, 'GM');
            showToast('✅ Remark added successfully', 'success');
            closeModal();
            renderDashboard();
        }

        // SELECT candidate - Move to Training Portal
        async function selectCandidate(id) {
            const candidate = candidates.find(c => c.id === id);
            if (!candidate) return;

            if (window.PortalFetch) PortalFetch.invalidatePipelineCaches();
            await fetch('api/update_candidate_global.php', {
                method: 'POST',
                credentials: 'include',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    id: candidate.id,
                    new_stage: 'hired',
                    action: 'gm_hired',
                    remark: 'SELECTED in GM interview - Moving to Training Portal',
                    user_role: 'GM'
                })
            });
            
            showToast(`✅ ${candidate.fullName} selected! Moving to Training Portal.`, 'success');
            renderDashboard();
        }

        // REJECT candidate
        function rejectCandidate(id) {
            const candidate = candidates.find(c => c.id === id);
            if (!candidate) return;
            showRejectionModal(candidate);
        }

        function showRejectionModal(candidate) {
            const reasons = [
                'Poor English communication',
                'Lack of relevant experience',
                'Overqualified',
                'Underqualified',
                'Salary expectation too high',
                'Not serious/motivated',
                'Poor attitude',
                'Late to interview',
                'Technical skills lacking',
                'Background verification failed',
                'Cultural fit issue'
            ];
            
            const modalHtml = `
                <div class="modal-overlay" id="rejectionModal">
                    <div class="modal">
                        <div class="modal-header">
                            <i class="fas fa-times-circle" style="color: var(--danger); font-size: 24px;"></i>
                            <h3>Reject ${candidate.fullName}</h3>
                            <button class="modal-close" onclick="closeModal()">×</button>
                        </div>
                        <div class="modal-body">
                            <p style="margin-bottom: 16px;">Please select rejection reason:</p>
                            <div class="rejection-reasons">
                                ${reasons.map(reason => `
                                    <div class="rejection-reason" onclick="selectReason(this, '${reason.replace(/'/g, "\\'")}')">
                                        <i class="fas fa-times-circle"></i>
                                        <span>${reason}</span>
                                    </div>
                                `).join('')}
                            </div>
                            <input type="text" id="customReason" class="rejection-custom-input" placeholder="Or type custom reason...">
                        </div>
                        <div class="modal-footer">
                            <button class="modal-btn modal-btn-cancel" onclick="closeModal()">Cancel</button>
                            <button class="modal-btn modal-btn-danger" onclick="confirmReject(${candidate.id})">Reject Candidate</button>
                        </div>
                    </div>
                </div>
            `;
            document.body.insertAdjacentHTML('beforeend', modalHtml);
            window.selectedRejectReason = '';
        }

        function selectReason(element, reason) {
            document.querySelectorAll('.rejection-reason').forEach(r => r.classList.remove('selected'));
            element.classList.add('selected');
            window.selectedRejectReason = reason;
        }

        async function confirmReject(candidateId) {
            const customReason = document.getElementById('customReason')?.value?.trim();
            const reason = customReason || window.selectedRejectReason;
            
            if (!reason) {
                showToast('Please select or enter a rejection reason', 'warning');
                return;
            }
            
            const candidate = candidates.find(c => c.id === candidateId);
            if (candidate) {
                if (window.PortalFetch) PortalFetch.invalidatePipelineCaches();
                await fetch('api/update_candidate_global.php', {
                    method: 'POST',
                    credentials: 'include',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        id: candidate.id,
                        new_stage: 'gm_rejected',
                        action: 'gm_reject',
                        remark: `REJECTED in GM: ${reason}`,
                        user_role: 'GM'
                    })
                });
                
                showToast(`❌ ${candidate.fullName} rejected`, 'warning');
                renderDashboard();
            }
            closeModal();
        }

        function showCandidateDetails(id) {
            const candidate = candidates.find(c => c.id === id);
            if (!candidate) return;
            let details = `📋 Candidate Details:\n\n`;
            details += `Name: ${candidate.fullName}\n`;
            details += `Father: ${candidate.fatherName || 'N/A'}\n`;
            details += `Phone: ${candidate.phone}\n`;
            details += `Email: ${candidate.email || 'N/A'}\n`;
            details += `CNIC: ${candidate.cnic || 'N/A'}\n`;
            details += `City: ${candidate.city || 'N/A'}\n`;
            details += `Position: ${candidate.position}\n`;
            details += `Graduation: ${candidate.graduation || 'N/A'}\n`;
            details += `Referred By: ${candidate.referredBy || 'Walk-in'}\n`;
            details += `HR Passed: ${candidate.hrDate ? new Date(candidate.hrDate).toLocaleDateString() : 'N/A'}\n`;
            if (candidate.remarks && candidate.remarks.length > 0) {
                details += `\nLatest Remark: ${candidate.remarks[candidate.remarks.length - 1].text}`;
            }
            alert(details);
        }

        // ==================== VIEW SWITCHING & RENDER ====================
        let currentView = 'dashboard';

        function switchView(viewName) {
            currentView = viewName;
            
            // Update sidebar active menu items
            document.querySelectorAll('.sidebar-menu .menu-item').forEach(item => item.classList.remove('active'));
            const activeMenuItem = document.getElementById(`menu-${viewName}`);
            if (activeMenuItem) {
                activeMenuItem.classList.add('active');
            }

            // Page title and subtitle updates
            const pageTitle = document.getElementById('pageTitle');
            const pageSubtitle = document.getElementById('pageSubtitle');

            // Hide all views
            const views = ['dashboard', 'pending-gm', 'selected'];
            views.forEach(v => {
                const el = document.getElementById(`view-${v}`);
                if (el) el.style.display = 'none';
            });

            // Show selected view
            const activeViewEl = document.getElementById(`view-${viewName}`);
            if (activeViewEl) {
                activeViewEl.style.display = viewName === 'dashboard' ? 'grid' : 'block';
            }

            if (viewName === 'dashboard') {
                if (pageTitle) pageTitle.textContent = 'Management Portal';
                if (pageSubtitle) pageSubtitle.textContent = 'Final Interview & Selection → Training';
                renderDashboard();
            } else if (viewName === 'pending-gm') {
                if (pageTitle) pageTitle.textContent = 'Pending GM Interviews';
                if (pageSubtitle) pageSubtitle.textContent = 'Candidates Passed from HR Awaiting Final GM Round';
                renderPendingGMView();
            } else if (viewName === 'selected') {
                if (pageTitle) pageTitle.textContent = 'Selected Candidates';
                if (pageSubtitle) pageSubtitle.textContent = 'Candidates Selected and Queued for Training';
                renderSelectedView();
            }
        }

        async function renderDashboard() {
            await loadData();

            const gmCandidates = candidates.filter(c => c.status === 'hr_passed');
            
            // Selected candidates (sent to training)
            const selectedCandidates = candidates.filter(c => 
                c.status === 'hired' || 
                c.status === 'training'
            );
            
            const hrPassed = candidates.filter(c => c.hrStatus === 'passed').length;
            const selected = selectedCandidates.length;
            const rejected = candidates.filter(c => c.gmStatus === 'rejected').length;

            const gmBadge = document.getElementById('pendingGMBadge');
            const selBadge = document.getElementById('selectedBadge');
            const gmCount = document.getElementById('pendingGMCount');
            const selCount = document.getElementById('selectedCount');

            if (gmBadge) gmBadge.textContent = gmCandidates.length;
            if (selBadge) selBadge.textContent = selected;
            if (gmCount) gmCount.textContent = gmCandidates.length;
            if (selCount) selCount.textContent = selected;

            const statsGrid = document.getElementById('statsGrid');
            if (statsGrid) {
                statsGrid.innerHTML = `
                    <div class="stat-card" style="cursor: pointer;" onclick="switchView('dashboard')">
                        <div class="stat-icon"><i class="fas fa-users"></i></div>
                        <div class="stat-content">
                            <div class="stat-label">HR Passed</div>
                            <div class="stat-value">${hrPassed}</div>
                        </div>
                    </div>
                    <div class="stat-card" style="cursor: pointer;" onclick="switchView('pending-gm')">
                        <div class="stat-icon"><i class="fas fa-clock"></i></div>
                        <div class="stat-content">
                            <div class="stat-label">Pending GM</div>
                            <div class="stat-value">${gmCandidates.length}</div>
                        </div>
                    </div>
                    <div class="stat-card" style="cursor: pointer;" onclick="switchView('selected')">
                        <div class="stat-icon"><i class="fas fa-check-circle" style="color: var(--secondary);"></i></div>
                        <div class="stat-content">
                            <div class="stat-label">Selected for Training</div>
                            <div class="stat-value">${selected}</div>
                        </div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-icon"><i class="fas fa-times-circle" style="color: var(--danger);"></i></div>
                        <div class="stat-content">
                            <div class="stat-label">Rejected</div>
                            <div class="stat-value">${rejected}</div>
                        </div>
                    </div>
                `;
            }

            const gmList = document.getElementById('gmList');
            const selectedList = document.getElementById('selectedList');
            if (gmList) gmList.innerHTML = renderGMCandidateList(gmCandidates);
            if (selectedList) selectedList.innerHTML = renderSelectedList(selectedCandidates);
            
            // Setup search
            const searchInput = document.getElementById('gmSearch');
            if (searchInput) {
                searchInput.oninput = (e) => {
                    const search = e.target.value.toLowerCase();
                    const filtered = gmCandidates.filter(c =>
                        c.fullName?.toLowerCase().includes(search) ||
                        c.phone?.includes(search) ||
                        c.email?.toLowerCase().includes(search)
                    );
                    if (gmList) gmList.innerHTML = renderGMCandidateList(filtered);
                };
            }

            if (currentView === 'pending-gm') renderPendingGMView();
            else if (currentView === 'selected') renderSelectedView();
        }

        function renderPendingGMView() {
            const gmCandidates = candidates.filter(c => c.status === 'hr_passed');
            const countEl = document.getElementById('queueGMCount');
            const listEl = document.getElementById('queueGMList');

            if (countEl) countEl.textContent = gmCandidates.length;
            if (listEl) listEl.innerHTML = renderGMCandidateList(gmCandidates);

            const searchInput = document.getElementById('queueGMSearch');
            if (searchInput) {
                searchInput.oninput = (e) => {
                    const search = e.target.value.toLowerCase();
                    const filtered = gmCandidates.filter(c =>
                        c.fullName?.toLowerCase().includes(search) ||
                        c.phone?.includes(search) ||
                        c.email?.toLowerCase().includes(search) ||
                        c.position?.toLowerCase().includes(search)
                    );
                    if (listEl) listEl.innerHTML = renderGMCandidateList(filtered);
                };
            }
        }

        function renderSelectedView() {
            const selectedCandidates = candidates.filter(c => 
                c.status === 'hired' || 
                c.status === 'training'
            );
            const countEl = document.getElementById('queueSelectedCount');
            const listEl = document.getElementById('queueSelectedList');

            if (countEl) countEl.textContent = selectedCandidates.length;
            if (listEl) listEl.innerHTML = renderSelectedList(selectedCandidates);

            const searchInput = document.getElementById('queueSelectedSearch');
            if (searchInput) {
                searchInput.oninput = (e) => {
                    const search = e.target.value.toLowerCase();
                    const filtered = selectedCandidates.filter(c =>
                        c.fullName?.toLowerCase().includes(search) ||
                        c.phone?.includes(search) ||
                        c.position?.toLowerCase().includes(search)
                    );
                    if (listEl) listEl.innerHTML = renderSelectedList(filtered);
                };
            }
        }

        function renderGMCandidateList(list) {
            if (list.length === 0) {
                return '<div class="empty-state"><i class="fas fa-users-slash"></i><h4>No Pending GM Interviews</h4><p>Candidates who pass HR and are sent to Final Interview will appear here.</p><button onclick="window.location.href=\'hr-portal.html\'" style="margin-top:15px;padding:10px 20px;background:var(--gradient-primary);border:none;border-radius:40px;color:white;cursor:pointer;"><i class="fas fa-arrow-left"></i> Go to HR Portal</button></div>';
            }

            return list.map(c => `
                <div class="candidate-item">
                    <div class="candidate-header">
                        <div class="candidate-avatar"><i class="fas fa-user"></i></div>
                        <div class="candidate-info">
                            <h4>${c.fullName}</h4>
                            <div class="candidate-tags">
                                <span class="tag campaign">${c.position || 'Campaign'}</span>
                                <span class="info-highlight">HR Passed: ${c.hrDate ? new Date(c.hrDate).toLocaleDateString() : 'N/A'}</span>
                            </div>
                        </div>
                    </div>
                    <div class="candidate-details">
                        <div class="detail-item"><i class="fas fa-phone"></i> ${c.phone}</div>
                        <div class="detail-item"><i class="fas fa-envelope"></i> ${c.email}</div>
                        <div class="detail-item"><i class="fas fa-id-card"></i> ${c.cnic}</div>
                        <div class="detail-item"><i class="fas fa-graduation-cap"></i> ${c.graduation}</div>
                        <div class="detail-item"><i class="fas fa-user-plus"></i> Referred: ${c.referredBy || 'Walk-in'}</div>
                        <div class="detail-item"><i class="fas fa-calendar"></i> Applied: ${new Date(c.timestamp || c.registeredAt).toLocaleDateString()}</div>
                    </div>
                    ${c.remarks && c.remarks.length > 0 ? `
                    <div class="remarks-preview">
                        <div class="remarks-preview-header"><i class="fas fa-comment"></i> Latest Remark</div>
                        <div class="remarks-preview-item"><strong>${c.remarks[c.remarks.length - 1].addedBy || 'System'}:</strong> ${c.remarks[c.remarks.length - 1].text}</div>
                    </div>
                    ` : ''}
                    <div class="action-buttons">
                        <button class="btn btn-info" onclick="showCandidateDetails(${c.id})"><i class="fas fa-eye"></i> Details</button>
                        <button class="btn btn-primary" onclick="showRemarksModal(${c.id})"><i class="fas fa-comment"></i> Remarks</button>
                        <button class="btn btn-success" onclick="selectCandidate(${c.id})"><i class="fas fa-check"></i> Select for Training</button>
                        <button class="btn btn-danger" onclick="rejectCandidate(${c.id})"><i class="fas fa-times"></i> Reject</button>
                    </div>
                </div>
            `).join('');
        }

        function renderSelectedList(list) {
            if (list.length === 0) {
                return '<div class="empty-state"><i class="fas fa-inbox"></i><h4>No Selected Candidates</h4><p>Candidates selected for training will appear here and in Training Portal.</p></div>';
            }

            return list.map(c => `
                <div class="selected-item">
                    <div class="selected-avatar"><i class="fas fa-user-check"></i></div>
                    <div class="selected-info">
                        <h5>${c.fullName}</h5>
                        <p>${c.position} - Selected for Training</p>
                    </div>
                    <div class="selected-status selected">Training Pending</div>
                </div>
            `).join('');
        }

        function closeModal() {
            const modal = document.querySelector('.modal-overlay');
            if (modal) modal.remove();
        }

        function toggleTheme() {
            const html = document.documentElement;
            const current = html.getAttribute('data-theme') || 'dark';
            const newTheme = current === 'dark' ? 'light' : 'dark';
            html.setAttribute('data-theme', newTheme);
            localStorage.setItem('theme', newTheme);
            const icon = document.getElementById('themeIcon');
            if (icon) icon.className = newTheme === 'dark' ? 'fas fa-moon' : 'fas fa-sun';
        }

        function logout() {
            if (confirm('Are you sure you want to logout?')) {
                window.location.href = 'index.html';
            }
        }

        const savedTheme = localStorage.getItem('theme') || 'dark';
        document.documentElement.setAttribute('data-theme', savedTheme);
        const themeIcon = document.getElementById('themeIcon');
        if (themeIcon) themeIcon.className = savedTheme === 'dark' ? 'fas fa-moon' : 'fas fa-sun';

        renderDashboard();

        if (window.PortalPoll) {
            PortalPoll.start('gm-dashboard', () => renderDashboard(), 30000, { pauseWhenHidden: true });
        }

        window.switchView = switchView;
        window.renderPendingGMView = renderPendingGMView;
        window.renderSelectedView = renderSelectedView;
        window.showRemarksModal = showRemarksModal;
        window.saveRemark = saveRemark;
        window.selectCandidate = selectCandidate;
        window.rejectCandidate = rejectCandidate;
        window.showCandidateDetails = showCandidateDetails;
        window.toggleTheme = toggleTheme;
        window.forceSync = forceSync;
        window.logout = logout;
        window.closeModal = closeModal;
        window.selectReason = selectReason;
        window.confirmReject = confirmReject;
    </script>
    <script src="js/portal-chat-fab.js"></script>
</body>
</html>
